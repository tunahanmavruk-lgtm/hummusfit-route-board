<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummus Fit — Route Board</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141311">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --ink:#141311;
    --dim:#7A776E;
    --line:rgba(20,19,17,0.09);
    --orange:#E8612C;
    --orange-tint:#FDEBE3;
    --teal:#1FA98F;
    --teal-tint:#E3F5F1;
    --black:#141311;
    --gold:#E0A83B;
    --red:#DA4A3F;
    --shadow: 0 1px 2px rgba(20,19,17,0.04), 0 8px 24px rgba(20,19,17,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(232,97,44,0.07), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(31,169,143,0.08), transparent 40%),
      var(--bg);
    padding-bottom: 60px;
  }

  header{
    padding: 30px 5vw 22px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    border-bottom: 2px solid var(--black);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 8px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(36px, 5.5vw, 60px);
    line-height: 0.95;
    letter-spacing: 0.01em;
  }
  h1 span{ color: var(--teal); }

  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: var(--dim);
    background: var(--card);
    border: 1.5px solid var(--line);
    padding: 9px 16px;
    border-radius: 999px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .reset-btn:hover{ border-color: var(--red); color: var(--red); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,19,17,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background: var(--card); border-radius: var(--radius, 16px);
    padding: 24px; max-width: 420px; width:100%;
  }
  .modal h3{
    font-family:'Bebas Neue', sans-serif; font-size: 26px; letter-spacing:0.02em;
    margin-bottom: 6px;
  }
  .modal-hint{
    font-family:'Inter', sans-serif; font-size: 13px; color: var(--dim);
    margin-bottom: 18px; line-height:1.5;
  }
  .modal-label{
    display:block; font-family:'JetBrains Mono', monospace; font-size: 10.5px;
    font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--dim); margin-bottom:6px; margin-top:14px;
  }
  .modal input[type="text"], .modal textarea{
    width:100%; background: var(--bg); border: 1.5px solid var(--line);
    color: var(--ink); font-family:'Inter', sans-serif; font-size: 14px;
    padding: 10px 12px; border-radius: 10px; outline:none; resize:vertical;
  }
  .modal input[type="text"]:focus, .modal textarea:focus{ border-color: var(--orange); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
  .modal-btn-secondary{
    font-family:'JetBrains Mono', monospace; font-size: 11px; font-weight:700;
    text-transform:uppercase; color: var(--dim); background: var(--card);
    border: 1.5px solid var(--line); padding: 10px 18px; border-radius: 999px; cursor:pointer;
  }
  .modal-btn-primary{
    font-family:'JetBrains Mono', monospace; font-size: 11px; font-weight:700;
    text-transform:uppercase; color:#fff; background: var(--orange);
    border: none; padding: 10px 18px; border-radius: 999px; cursor:pointer;
  }
  .modal-btn-primary:disabled{ opacity:0.5; cursor:default; }

  main{
    max-width: 1100px;
    margin: 0 auto;
    padding: 26px 5vw 0;
  }

  /* Motion on real state changes only — render() rebuilds the whole
     board's DOM every poll, so these are one-shot @keyframes tied to a
     class the JS adds only when something genuinely changed since the
     last render, not a plain `transition` (which needs a persisted
     element to animate between two states, and there isn't one here). */
  @keyframes rowFlash{
    0%{ background: var(--teal-tint); box-shadow: 0 0 0 2px rgba(31,169,143,0.4); }
    100%{ background: var(--bg); box-shadow: 0 0 0 0 rgba(31,169,143,0); }
  }
  .stop-row.just-changed{ animation: rowFlash 1.1s ease-out; }

  @keyframes dotPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.55); }
    100%{ transform: scale(1); }
  }
  .status-dot.just-changed{ animation: dotPop 0.5s cubic-bezier(.34,1.56,.64,1); }

  @keyframes pillArrive{
    0%{ transform: scale(0.85); opacity:0; }
    60%{ transform: scale(1.08); opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }
  .order-pill.just-arrived{ animation: pillArrive 0.5s cubic-bezier(.34,1.56,.64,1); }

  @keyframes routeStartFlash{
    0%{ box-shadow: inset 0 0 0 3px rgba(31,169,143,0); }
    30%{ box-shadow: inset 0 0 0 3px rgba(31,169,143,0.9); }
    100%{ box-shadow: inset 0 0 0 3px rgba(31,169,143,0); }
  }
  .route-card.just-started{ animation: routeStartFlash 1.4s ease-out; }

  .route-card{
    background: var(--card);
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    overflow:hidden;
  }
  .route-head{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap: 10px;
    padding: 18px 22px;
    background: var(--black);
    color: #fff;
  }
  .route-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 25px;
    letter-spacing:0.01em;
  }
  .route-time{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:700;
    color: var(--black);
    background: #fff;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .route-size{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: rgba(255,255,255,0.55);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .route-progress{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: var(--teal);
  }

  .route-actions{
    display:flex;
    gap: 10px;
    padding: 14px 22px;
    flex-wrap:wrap;
    border-bottom: 1px solid var(--line);
    align-items:center;
  }
  .action-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding: 9px 16px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .action-btn:hover{ transform: translateY(-1px); }
  .action-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .action-btn.optimize{ background: var(--black); color:#fff; }
  .action-btn.start{ background: var(--orange); color:#fff; }
  .action-btn.started{ background: var(--teal-tint); color: var(--teal); }
  .action-btn.maps{
    background: #fff;
    color: var(--teal);
    border: 1.5px solid var(--teal);
    text-decoration:none;
  }
  .action-btn.maps:hover{ background: var(--teal-tint); }

  .eta-summary{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: var(--dim);
    margin-left:auto;
  }
  .eta-summary.live{
    color: var(--teal);
  }

  .started-time-badge{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: var(--orange);
    background: var(--orange-tint);
    padding: 6px 12px;
    border-radius: 999px;
  }

  .hq-address{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    padding: 8px 22px 0;
  }

  .parkway-warning{
    margin: 10px 22px 0;
    padding: 10px 14px;
    background: #FFF4E5;
    border: 1.5px solid var(--gold);
    border-radius: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: #8A5A00;
    line-height:1.5;
  }

  .stop-address{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    width:100%;
    margin-top: -4px;
    padding-left: 25px;
  }

  .status-stages{
    display:flex;
    align-items:center;
    gap: 4px;
    flex-shrink:0;
  }
  .status-dot{
    width: 13px; height:13px;
    border-radius:50%;
    background: #fff;
    border: 2.5px solid var(--dim);
    cursor:pointer;
    transition: all .15s ease;
  }
  .status-dot.enroute{ background: var(--gold); border-color: var(--gold); }
  .status-dot.picked{ background: #A25FE0; border-color: #A25FE0; }
  .status-dot.arrived{ background: #4F9BE8; border-color: #4F9BE8; }
  .status-dot.delivered{ background: var(--teal); border-color: var(--teal); }

  .eta-chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    color: var(--dim);
    white-space:nowrap;
  }

  .notif-banner{
    display:block;
    width:100%;
    background: var(--teal-tint);
    border: 1.5px solid rgba(31,169,143,0.4);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 13.5px;
    padding: 14px 20px;
    border-radius: var(--radius, 16px);
    margin-bottom: 18px;
    cursor:pointer;
    text-align:left;
  }
  .notif-banner:active{ opacity:0.8; }

  .picking-flash-chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:800;
    letter-spacing:0.03em;
    white-space:nowrap;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
    background: #E8612C;
    animation: pickingFlash 1s ease-in-out infinite;
  }
  @keyframes pickingFlash{
    0%, 100% { background: #E8612C; box-shadow: 0 0 0 rgba(232,97,44,0); }
    50% { background: #FF2D55; box-shadow: 0 0 10px rgba(255,45,85,0.6); }
  }
  .picking-done-chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    white-space:nowrap;
    padding: 4px 10px;
    border-radius: 999px;
    color: var(--teal);
    background: var(--teal-tint);
  }

  .crate-count-chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    white-space:nowrap;
    padding: 4px 10px;
    border-radius: 999px;
    color: var(--ink);
    background: var(--card-2, #F1F0EC);
    border: 1.5px solid var(--line);
  }

  .assign-row{
    display:flex;
    gap: 12px;
    padding: 16px 22px;
    flex-wrap:wrap;
    border-bottom: 1px solid var(--line);
    align-items:flex-end;
  }
  .assign-field{ flex:1; min-width: 170px; }
  .assign-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  select, input[type="text"]{
    width:100%;
    background: var(--bg);
    border: 1.5px solid var(--line);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 10px;
    outline:none;
  }
  select:focus, input[type="text"]:focus{ border-color: var(--teal); }

  .van-live{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--teal-tint);
    color: var(--teal);
    text-decoration:none;
    white-space:nowrap;
    transition: transform .15s ease;
  }
  .van-live:hover{ transform: translateY(-1px); }
  .van-live .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
    animation: pulse 2s infinite;
  }
  .van-live.idle{ background: var(--orange-tint); color: var(--orange); }
  .van-live.idle .dot{ background: var(--orange); box-shadow:0 0 6px var(--orange); }
  .van-live.offline{ background: #F0EFEC; color: var(--dim); }
  .van-live.offline .dot{ background: var(--dim); box-shadow:none; animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .stops{ padding: 14px 22px 18px; display:flex; flex-direction:column; gap:10px; }

  .stop-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--bg);
  }

  .stop-name{ font-weight:700; font-size: 14.5px; flex-shrink:0; }
  .stop-badge{
    font-family:'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding: 2px 8px;
    border-radius:999px;
    background: var(--orange-tint);
    color: var(--orange);
  }

  .order-pill{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding: 7px 14px;
    border-radius: 999px;
    white-space:nowrap;
    border: 1.5px solid var(--line);
    color: var(--dim);
    background: #fff;
  }
  .order-pill.not-scheduled{
    border-style: dashed;
    color: var(--steel-light, var(--dim));
    background: transparent;
    opacity: 0.65;
  }
  .order-pill.lit{
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
    cursor:pointer;
    text-decoration:none;
    box-shadow: 0 2px 10px rgba(232,97,44,0.35);
    animation: litPulse 1.8s ease-in-out infinite;
  }
  @keyframes litPulse{
    0%,100%{ box-shadow: 0 2px 10px rgba(232,97,44,0.35); }
    50%{ box-shadow: 0 2px 18px rgba(232,97,44,0.6); }
  }

  .status-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:700;
    text-transform:uppercase;
    color: var(--dim);
    width: 78px;
  }
  .status-label.enroute{ color: var(--gold); }
  .status-label.picked{ color: #A25FE0; }
  .status-label.arrived{ color: #4F9BE8; }
  .status-label.delivered{ color: var(--teal); }

  .refresh-note{
    max-width: 1100px;
    margin: 20px auto 0;
    padding: 0 5vw;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--dim);
  }

  .clock-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap: 6px;
  }
  .live-clock{
    font-family:'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight:700;
    color: var(--black);
    font-variant-numeric: tabular-nums;
  }
  .window-badge{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding: 5px 11px;
    border-radius: 999px;
  }
  .window-badge.open{ background: var(--orange-tint); color: var(--orange); }
  .window-badge.closed{ background: #F0EFEC; color: var(--dim); }
  .window-badge .dot{
    width:6px; height:6px; border-radius:50%;
  }
  .window-badge.open .dot{ background: var(--orange); animation: pulse 1.5s infinite; }
  .window-badge.closed .dot{ background: var(--dim); }

  @media (max-width: 640px){
    .stop-row{ flex-wrap:wrap; }
    .order-pill{ margin-left:0; order:4; width:100%; text-align:center; }
    .status-label{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Hummus Fit / Transportation</div>
    <h1>ROUTE <span>BOARD</span></h1>
  </div>
  <div class="clock-block">
    <div class="live-clock" id="liveClock">--:--:-- --</div>
    <div class="window-badge closed" id="windowBadge"><span class="dot"></span><span id="windowBadgeText">Checking order window…</span></div>
    <button class="reset-btn" id="resetBtn">Reset Today's Board</button>
    <button class="reset-btn" id="announceBtn" style="margin-left:8px;">📣 Send Announcement</button>
  </div>
</header>

<div class="modal-overlay" id="announceModal" style="display:none;">
  <div class="modal">
    <h3>Send Announcement</h3>
    <p class="modal-hint">Goes out as a push notification to everyone currently subscribed — local and out-of-state, on any page.</p>
    <label class="modal-label">Title</label>
    <input type="text" id="announceTitle" maxlength="60" placeholder="e.g. Early close today">
    <label class="modal-label">Message</label>
    <textarea id="announceBody" maxlength="180" rows="3" placeholder="e.g. Warehouse closing at 6pm, please finish picking by 5:30"></textarea>
    <div class="modal-actions">
      <button class="modal-btn-secondary" id="announceCancel">Cancel</button>
      <button class="modal-btn-primary" id="announceSend">Send</button>
    </div>
  </div>
</div>

<main id="routesContainer">
  <div style="color:var(--dim); font-family:'JetBrains Mono', monospace; font-size:13px; padding:30px 0;">Loading routes…</div>
</main>


<script>
  var STATUS_CYCLE = ['not_started', 'picked', 'enroute', 'arrived', 'delivered'];
  var STATUS_LABEL = { not_started: 'Not Started', picked: 'Order Picked', enroute: 'En Route', arrived: 'Arrived', delivered: 'Delivered' };

  var pushSubscribedFlag = false;
  function pushSupported(){
    return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
  }
  function urlBase64ToUint8Array(base64String){
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for(var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }
  function subscribeToPush(){
    if(!pushSupported()) return Promise.resolve();
    return navigator.serviceWorker.register('/service-worker.js')
      .then(function(reg){ return reg.pushManager.getSubscription().then(function(existing){ return { reg: reg, existing: existing }; }); })
      .then(function(r){
        if(r.existing) { pushSubscribedFlag = true; return r.existing; }
        return fetch('/api/push-vapid-key').then(function(res){ return res.json(); }).then(function(data){
          return r.reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(data.publicKey)
          });
        });
      })
      .then(function(sub){
        if(!sub) return;
        pushSubscribedFlag = true;
        return fetch('/api/push-subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });
      })
      .catch(function(err){ console.error('Push subscribe failed:', err); });
  }
  function wireNotifBanner(){
    var btn = document.getElementById('enableNotifsBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      tapFeedback();
      if(Notification.permission === 'denied'){
        alert('Notifications were previously blocked for this app. To turn them back on, check this device\'s notification settings for the Route Board home screen icon.');
        return;
      }
      Notification.requestPermission().then(function(permission){
        if(permission === 'granted'){
          subscribeToPush().then(function(){ render(); });
        } else {
          render();
        }
      });
    });
  }

  var routesData = [];
  var fleetData = [];
  var driversData = [];
  var hqData = { name: '', address: '' };
  var stateData = { assignments: {}, stopStatus: {}, routeMeta: {} };
  var ordersByStop = {};
  var pickingStatusByStop = {};
  var scheduledToday = {};
  var vanStatusList = [];
  var etaCache = {}; // routeId -> eta response

  // Snapshots of what render() showed last time, so a poll-driven
  // re-render (every 10s, or right after an action) can tell "this
  // specific stop's status just changed" apart from "this row happens to
  // say picked, same as it did before" — render() fully rebuilds the DOM
  // every call, so a plain CSS transition never fires (there's no
  // before/after on a persisted element to transition between). A
  // one-shot @keyframes animation applied only to rows that actually
  // changed since last render sidesteps that entirely.
  var prevStopStatus = {};
  var prevOrdersByStop = {};
  var prevRouteMeta = {};
  var hasRenderedOnce = false;

  // Short, reusable tap feedback (sound + haptic) for the board's main
  // actions — cycling a stop's status, creating/starting a route, turning
  // on notifications. One shared AudioContext, not a fresh one per call:
  // dispatchers tap through this a lot more often than, say, a single
  // barcode scan on the picking screen, and browsers cap how many
  // contexts can be alive at once.
  var tapAudioCtx = null;
  function tapFeedback(){
    try{
      if(!tapAudioCtx) tapAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = tapAudioCtx;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch(e){ /* Web Audio unsupported — silently skip, action still happens */ }
    if(navigator.vibrate) navigator.vibrate(18);
  }

  function nextStatus(current){
    var i = STATUS_CYCLE.indexOf(current || 'not_started');
    return STATUS_CYCLE[(i + 1) % STATUS_CYCLE.length];
  }

  function buildVanOptions(selected){
    var html = '<option value="">— Select van —</option>';
    fleetData.forEach(function(v){
      html += '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
    });
    return html;
  }

  function buildDriverOptions(selected){
    var html = '<option value="">— Select driver —</option>';
    driversData.forEach(function(d){
      html += '<option value="' + d + '"' + (d === selected ? ' selected' : '') + '>' + d + '</option>';
    });
    return html;
  }

  function findVanStatus(vanName){
    if(!vanName) return null;
    var needle = vanName.toLowerCase();
    for(var i=0;i<vanStatusList.length;i++){
      var hay = (vanStatusList[i].nickName || '').toLowerCase();
      if(hay && (needle.indexOf(hay) !== -1 || hay.indexOf(needle.split(' ')[0]) !== -1)){
        return vanStatusList[i];
      }
    }
    return null;
  }

  function vanLiveHtml(vanName){
    if(!vanName) return '';
    var v = findVanStatus(vanName);
    if(!v){
      return '<a class="van-live offline" href="' + FLEET_TRACKER_URL + '" target="_blank" rel="noopener"><span class="dot"></span>No live data</a>';
    }
    var cls = v.speed > 1 ? '' : (v.isRunning ? 'idle' : 'offline');
    var label = v.speed > 1 ? Math.round(v.speed) + ' mph' : (v.isRunning ? 'Idling' : 'Parked');
    return '<a class="van-live ' + cls + '" href="' + FLEET_TRACKER_URL + '" target="_blank" rel="noopener"><span class="dot"></span>' + label + '</a>';
  }

  var FLEET_TRACKER_URL = 'https://hummusfit-fleet-tracker-production.up.railway.app';

  function fmtTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', { timeZone:'America/New_York', hour:'numeric', minute:'2-digit' });
  }

  function render(){
    var container = document.getElementById('routesContainer');
    container.innerHTML = '';

    // Never animate the very first paint — everything looks "new"
    // relative to an empty snapshot, which would flash the entire board
    // on load instead of just what actually changed since last time.
    var isFirstRender = !hasRenderedOnce;
    hasRenderedOnce = true;

    if(pushSupported() && Notification.permission !== 'granted'){
      var notifBanner = document.createElement('button');
      notifBanner.id = 'enableNotifsBtn';
      notifBanner.className = 'notif-banner';
      notifBanner.innerHTML = '🔔 Get notified the moment a new order comes in — tap to turn on';
      container.appendChild(notifBanner);
    } else if(pushSupported() && Notification.permission === 'granted' && !pushSubscribedFlag){
      subscribeToPush();
    }

    routesData.forEach(function(route){
      var assignment = stateData.assignments[route.id] || { van: '', driver: '' };
      var meta = stateData.routeMeta[route.id] || {};
      var eta = etaCache[route.id];

      // Stops that aren't scheduled to deliver today (e.g. Natural Body's
      // Mon/Wed/Fri-only schedule) are fully hidden from the board, not
      // just muted — the route visually shrinks on its off days.
      var visibleStops = route.stops.filter(function(s){
        var key = s.name.toLowerCase();
        return scheduledToday[key] !== false;
      });

      var deliveredCount = visibleStops.filter(function(s){
        var st = stateData.stopStatus[s.id];
        return st && st.status === 'delivered';
      }).length;

      var wasStarted = !!(prevRouteMeta[route.id] && prevRouteMeta[route.id].startedAt);
      var routeJustStarted = !isFirstRender && !wasStarted && !!meta.startedAt;

      var card = document.createElement('div');
      card.className = 'route-card' + (routeJustStarted ? ' just-started' : '');

      // Determine stop display order: optimized order if we have it, otherwise original
      var orderedStops = visibleStops;
      if(meta.optimizedStopIds && meta.optimizedStopIds.length === route.stops.length){
        orderedStops = meta.optimizedStopIds
          .map(function(id){ return route.stops.find(function(s){ return s.id === id; }); })
          .filter(function(s){ return s && scheduledToday[s.name.toLowerCase()] !== false; });
      }

      var stopsHtml = '';
      orderedStops.forEach(function(stop){
        var stopState = stateData.stopStatus[stop.id] || {};
        var status = stopState.status || 'not_started';
        var stopKey = stop.name.toLowerCase();
        var order = ordersByStop[stopKey];
        var isScheduled = scheduledToday[stopKey] !== false; // default true if unknown

        // Real ground truth, not a guess: this stop's status right now vs.
        // what it was the last time render() ran. Only flash when it
        // actually moved (not-started -> picked, etc.) — re-rendering the
        // same status every 10s poll shouldn't re-trigger the animation.
        var prevStatus = (prevStopStatus[stop.id] || {}).status || 'not_started';
        var statusJustChanged = !isFirstRender && prevStatus !== status;
        var orderJustArrived = !isFirstRender && !prevOrdersByStop[stopKey] && !!order;

        var pillHtml;
        if(order){
          pillHtml = '<a class="order-pill lit' + (orderJustArrived ? ' just-arrived' : '') + '" href="/picking?stop=' + encodeURIComponent(stop.name) + '" target="_blank" rel="noopener">' + order.orderName + ' →</a>';
        } else if(!isScheduled){
          pillHtml = '<span class="order-pill not-scheduled">No delivery today</span>';
        } else {
          pillHtml = '<span class="order-pill">No order yet</span>';
        }

        var etaChip = '';
        if(eta && eta.available && eta.etaByStopId && eta.etaByStopId[stop.id] && status !== 'delivered'){
          etaChip = '<span class="eta-chip">ETA ' + fmtTime(eta.etaByStopId[stop.id]) + '</span>';
        }
        var arrivedChip = stopState.arrivedAt ? '<span class="eta-chip">Arrived ' + fmtTime(stopState.arrivedAt) + '</span>' : '';

        var pickingInfo = pickingStatusByStop[stopKey] || { status: 'not_started' };
        var pickingChip = '';
        if(pickingInfo.status === 'in_progress'){
          var pct = (pickingInfo.percent !== undefined) ? pickingInfo.percent : 0;
          pickingChip = '<span class="picking-flash-chip">⚡ PICKING IN PROGRESS — ' + pct + '%' + (pickingInfo.pickedBy ? ' — ' + pickingInfo.pickedBy.toUpperCase() : '') + '</span>';
        } else if(pickingInfo.status === 'completed'){
          var timeRange = '';
          if(pickingInfo.startedAt && pickingInfo.completedAt){
            timeRange = ' — ' + fmtTime(pickingInfo.startedAt) + ' to ' + fmtTime(pickingInfo.completedAt);
          }
          pickingChip = '<span class="picking-done-chip">✓ Picked' + (pickingInfo.pickedBy ? ' by ' + pickingInfo.pickedBy : '') + timeRange + '</span>';
        }

        // Crate count — how many physical boxes exist for this order so
        // far, so a driver knows how many crates to expect/load for this
        // stop before even opening the picking screen.
        var crateChip = '';
        if(pickingInfo.crateCount && pickingInfo.crateCount > 0){
          crateChip = '<span class="crate-count-chip">📦 ' + pickingInfo.crateCount + ' crate' + (pickingInfo.crateCount === 1 ? '' : 's') + '</span>';
        }

        // Showing "NOT STARTED" (delivery status) right next to a
        // picking-in-progress/completed chip reads as a contradiction —
        // it's really just two different things (delivery vs picking),
        // but only the picking chip matters at this stage, so hide the
        // delivery label specifically in that case. Any other delivery
        // status (en route, arrived, delivered) still always shows.
        var suppressStatusLabel = status === 'not_started' && (pickingInfo.status === 'in_progress' || pickingInfo.status === 'completed');
        var statusLabelHtml = suppressStatusLabel ? '' : ('<div class="status-label ' + status + '">' + STATUS_LABEL[status] + '</div>');

        stopsHtml +=
          '<div class="stop-row' + (statusJustChanged ? ' just-changed' : '') + '">' +
            '<div class="status-dot ' + status + (statusJustChanged ? ' just-changed' : '') + '" data-stop="' + stop.id + '"></div>' +
            '<div class="stop-name">' + stop.name + '</div>' +
            (stop.brand ? '<span class="stop-badge">' + stop.brand + '</span>' : '') +
            statusLabelHtml +
            pickingChip +
            crateChip +
            (etaChip || arrivedChip) +
            pillHtml +
            '<div class="stop-address">' + (stop.address || '') + '</div>' +
          '</div>';
      });

      var optimizeBtn = '<button class="action-btn optimize" data-optimize="' + route.id + '">Create Route</button>';
      // This used to also render a second, near-identical "🕐 Started at
      // HH:MM" badge right next to this one — same information, worded
      // slightly differently, showing twice in a row. Just the one now.
      var startBtn = meta.startedAt
        ? '<span class="action-btn started">🕐 Started ' + fmtTime(meta.startedAt) + '</span>'
        : '<button class="action-btn start" data-start="' + route.id + '">Start Route</button>';

      var etaSummary = '';
      if(eta && eta.available && eta.etaBackToHQ){
        etaSummary = '<span class="eta-summary live">Live — Back to HQ ~' + fmtTime(eta.etaBackToHQ) + '</span>';
      } else if(meta.totalDurationSeconds){
        var mins = Math.round(meta.totalDurationSeconds / 60);
        etaSummary = '<span class="eta-summary">Planned — Est. total drive: ' + mins + ' min</span>';
      }

      // Once a route has been optimized, build a real Google Maps link —
      // the same kind you could tap on a phone — pre-loaded with HQ as
      // start/end and every stop in the exact optimized order, so a
      // driver gets actual turn-by-turn navigation, not just a number.
      var openMapsBtn = '';
      if(meta.optimizedStopIds && meta.optimizedStopIds.length){
        var orderedForMaps = meta.optimizedStopIds
          .map(function(id){ return route.stops.find(function(s){ return s.id === id; }); })
          .filter(function(s){ return s && s.address && scheduledToday[s.name.toLowerCase()] !== false; });
        if(orderedForMaps.length){
          var origin = encodeURIComponent(hqData.address);
          var destination = encodeURIComponent(hqData.address);
          var waypoints = orderedForMaps.map(function(s){ return encodeURIComponent(s.address); }).join('|');
          var mapsUrl = 'https://www.google.com/maps/dir/?api=1&origin=' + origin +
            '&destination=' + destination + '&waypoints=' + waypoints + '&travelmode=driving';
          openMapsBtn = '<a class="action-btn maps" href="' + mapsUrl + '" target="_blank" rel="noopener">Open in Google Maps</a>';
        }
      }

      var parkwayWarning = '';
      if(meta.flaggedParkways && meta.flaggedParkways.length > 0){
        parkwayWarning =
          '<div class="parkway-warning">⚠ Route may include: ' +
          meta.flaggedParkways.join(', ') +
          ' — verify before dispatching, commercial vans are not permitted</div>';
      }

      card.innerHTML =
        '<div class="route-head">' +
          '<span class="route-name">' + route.name + '</span>' +
          '<span class="route-time">' + route.time + '</span>' +
          '<span class="route-size">' + route.vanSize + '</span>' +
          '<span class="route-progress">' + deliveredCount + '/' + visibleStops.length + ' delivered</span>' +
        '</div>' +
        parkwayWarning +
        '<div class="assign-row">' +
          '<div class="assign-field">' +
            '<div class="assign-label">Van</div>' +
            '<select data-route="' + route.id + '" class="van-select">' + buildVanOptions(assignment.van) + '</select>' +
          '</div>' +
          '<div class="assign-field">' +
            '<div class="assign-label">Driver</div>' +
            '<select data-route="' + route.id + '" class="driver-select">' + buildDriverOptions(assignment.driver) + '</select>' +
          '</div>' +
          (assignment.van ? vanLiveHtml(assignment.van) : '') +
        '</div>' +
        '<div class="route-actions">' +
          optimizeBtn + startBtn + openMapsBtn + etaSummary +
        '</div>' +
        '<div class="stops">' + stopsHtml + '</div>';

      container.appendChild(card);
    });

    // Snapshot what just got rendered so the NEXT render() call (poll
    // tick, or right after an action) can tell what actually changed.
    var newPrevStopStatus = {};
    Object.keys(stateData.stopStatus || {}).forEach(function(id){
      newPrevStopStatus[id] = { status: (stateData.stopStatus[id] || {}).status || 'not_started' };
    });
    prevStopStatus = newPrevStopStatus;

    var newPrevOrdersByStop = {};
    Object.keys(ordersByStop || {}).forEach(function(key){ newPrevOrdersByStop[key] = true; });
    prevOrdersByStop = newPrevOrdersByStop;

    var newPrevRouteMeta = {};
    routesData.forEach(function(route){
      var m = (stateData.routeMeta && stateData.routeMeta[route.id]) || {};
      newPrevRouteMeta[route.id] = { startedAt: m.startedAt || null };
    });
    prevRouteMeta = newPrevRouteMeta;

    document.querySelectorAll('.status-dot').forEach(function(dot){
      dot.addEventListener('click', function(){
        tapFeedback();
        var stopId = dot.dataset.stop;
        var current = (stateData.stopStatus[stopId] || {}).status || 'not_started';
        var next = nextStatus(current);
        stateData.stopStatus[stopId] = Object.assign({}, stateData.stopStatus[stopId], { status: next });
        render();
        fetch('/api/stop-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopId: stopId, status: next })
        }).then(function(r){ return r.json(); }).then(function(data){
          if(data.state){ stateData = data.state; render(); }
        });
      });
    });


    document.querySelectorAll('[data-optimize]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var routeId = btn.dataset.optimize;
        btn.disabled = true;
        btn.textContent = 'Optimizing…';
        fetch('/api/optimize-route', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ routeId: routeId })
        }).then(function(r){
          return r.json().then(function(data){ return { ok: r.ok, data: data }; });
        }).then(function(result){
          if(!result.ok || result.data.error){
            alert('Could not create route: ' + (result.data.error || 'Unknown server error. Check that GOOGLE_MAPS_API_KEY is set in Railway.'));
            render();
            return;
          }
          if(result.data.state){ stateData = result.data.state; }
          render();
        }).catch(function(err){
          alert('Could not reach the server to create the route: ' + err.message);
          render();
        });
      });
    });

    document.querySelectorAll('[data-start]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var routeId = btn.dataset.start;
        btn.disabled = true;
        btn.textContent = 'Starting…';
        fetch('/api/start-route', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ routeId: routeId })
        }).then(function(r){ return r.json(); }).then(function(data){
          if(data.warning){ console.warn(data.warning); }
          if(data.state){ stateData = data.state; }
          fetchEtaFor(routeId);
          render();
        }).catch(function(){ render(); });
      });
    });

    document.querySelectorAll('.van-select').forEach(function(sel){
      sel.addEventListener('change', function(){
        var routeId = sel.dataset.route;
        stateData.assignments[routeId] = stateData.assignments[routeId] || {};
        stateData.assignments[routeId].van = sel.value;
        // Deferred on purpose: rebuilding the whole DOM (including this
        // very <select>) synchronously inside its own change event is a
        // known iOS Safari crash — the page goes blank white. Letting the
        // browser finish settling this interaction first fixes it.
        setTimeout(render, 0);
        fetch('/api/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ routeId: routeId, van: sel.value })
        });
      });
    });

    document.querySelectorAll('.driver-select').forEach(function(sel){
      sel.addEventListener('change', function(){
        var routeId = sel.dataset.route;
        stateData.assignments[routeId] = stateData.assignments[routeId] || {};
        stateData.assignments[routeId].driver = sel.value;
        setTimeout(render, 0);
        fetch('/api/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ routeId: routeId, driver: sel.value })
        });
      });
    });
    wireNotifBanner();
  }

  function fetchEtaFor(routeId){
    return fetch('/api/route-eta/' + routeId).then(function(r){ return r.json(); }).then(function(data){
      etaCache[routeId] = data;
      render();
    }).catch(function(){});
  }

  function refreshAllStartedEtas(){
    Object.keys(stateData.routeMeta || {}).forEach(function(routeId){
      if(stateData.routeMeta[routeId].startedAt){
        fetchEtaFor(routeId);
      }
    });
  }

  function loadInitial(){
    Promise.all([
      fetch('/api/routes').then(function(r){ return r.json(); }),
      fetch('/api/state').then(function(r){ return r.json(); }),
      fetch('/api/today-orders').then(function(r){ return r.json(); }),
      fetch('/api/van-status').then(function(r){ return r.json(); })
    ]).then(function(results){
      routesData = results[0].routes;
      fleetData = results[0].fleet;
      driversData = results[0].drivers || [];
      hqData = results[0].hq || { name: 'HQ', address: '' };
      stateData = results[1];
      ordersByStop = results[2].byStopName || {};
      scheduledToday = results[2].scheduledToday || {};
      pickingStatusByStop = results[2].pickingStatus || {};
      vanStatusList = results[3].vehicles || [];
      render();
      refreshAllStartedEtas();
    }).catch(function(){
      document.getElementById('routesContainer').innerHTML =
        '<div style="color:#DA4A3F; font-family:\'JetBrains Mono\', monospace; padding:30px 0;">Couldn\'t load the route board.</div>';
    });
  }

  function pollState(){
    Promise.all([
      fetch('/api/state').then(function(r){ return r.json(); }),
      fetch('/api/today-orders').then(function(r){ return r.json(); }),
      fetch('/api/van-status').then(function(r){ return r.json(); })
    ]).then(function(results){
      stateData = results[0];
      ordersByStop = results[1].byStopName || {};
      scheduledToday = results[1].scheduledToday || {};
      pickingStatusByStop = results[1].pickingStatus || {};
      vanStatusList = results[2].vehicles || [];
      render();
      refreshAllStartedEtas();
    }).catch(function(){});
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Reset all van/driver assignments and stop statuses for today?')) return;
    fetch('/api/reset-day', { method: 'POST' }).then(function(){ loadInitial(); });
  });

  var announceModal = document.getElementById('announceModal');
  var announceTitleInput = document.getElementById('announceTitle');
  var announceBodyInput = document.getElementById('announceBody');
  var announceSendBtn = document.getElementById('announceSend');

  document.getElementById('announceBtn').addEventListener('click', function(){
    announceTitleInput.value = '';
    announceBodyInput.value = '';
    announceModal.style.display = 'flex';
    announceTitleInput.focus();
  });
  document.getElementById('announceCancel').addEventListener('click', function(){
    announceModal.style.display = 'none';
  });
  announceModal.addEventListener('click', function(e){
    if(e.target === announceModal) announceModal.style.display = 'none';
  });
  announceSendBtn.addEventListener('click', function(){
    var title = announceTitleInput.value.trim();
    var body = announceBodyInput.value.trim();
    if(!title || !body){
      alert('Both a title and a message are needed before sending.');
      return;
    }
    announceSendBtn.disabled = true;
    announceSendBtn.textContent = 'Sending…';
    fetch('/api/push-send-manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title, body: body })
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        announceModal.style.display = 'none';
        if(data.sentTo === 0){
          alert('Sent — but no one is currently subscribed to notifications yet, so no one actually received it.');
        } else {
          alert('Sent to ' + data.sentTo + ' subscribed device' + (data.sentTo === 1 ? '' : 's') + '.');
        }
      })
      .catch(function(){
        alert('Something went wrong sending that — try again.');
      })
      .finally(function(){
        announceSendBtn.disabled = false;
        announceSendBtn.textContent = 'Send';
      });
  });

  loadInitial();
  setInterval(pollState, 10000);

  // ---- Live clock (Eastern Time, ticks every second) ----
  function tickClock(){
    var now = new Date();
    var timeStr = now.toLocaleTimeString('en-US', {
      timeZone: 'America/New_York',
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
    document.getElementById('liveClock').textContent = timeStr + ' ET';
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- Order window badge ----
  function updateWindowBadge(){
    fetch('/api/status').then(function(r){ return r.json(); }).then(function(data){
      var badge = document.getElementById('windowBadge');
      var text = document.getElementById('windowBadgeText');
      if(!data.orderWindow){ return; }
      var start = new Date(data.orderWindow.start);
      var end = new Date(data.orderWindow.end);
      var fmtOpts = { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true };
      var startStr = start.toLocaleTimeString('en-US', fmtOpts);
      var endStr = end.toLocaleTimeString('en-US', fmtOpts);
      if(data.orderWindow.isOpen){
        badge.className = 'window-badge open';
        text.textContent = 'Orders open until ' + endStr;
      } else {
        badge.className = 'window-badge closed';
        text.textContent = 'Showing orders from ' + startStr + '–' + endStr;
      }
    }).catch(function(){});
  }
  updateWindowBadge();
  setInterval(updateWindowBadge, 30000);
</script>

</body>
