<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phomemo M260 — Bluetooth Diagnostic v2</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 16px; margin: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #999; font-size: 13px; margin: 0 0 20px; }
  button { display: block; width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 10px; margin-bottom: 10px; }
  #connectBtn { background: #2BBFAA; color: #000; }
  .trial { background: #E8612C; color: #fff; }
  button:disabled { opacity: 0.35; }
  #log { background: #000; border: 1px solid #333; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; height: 42vh; overflow-y: auto; margin-top: 8px; }
  .ok { color: #2BBFAA; }
  .err { color: #ff6b6b; }
  .info { color: #999; }
  .divider { border-top: 1px solid #333; margin: 16px 0 12px; padding-top: 4px; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  canvas { display: none; }
</style>
</head>
<body>
  <h1>Phomemo M260 — Bluetooth Diagnostic v2</h1>
  <p class="sub">Connect once, then run each trial below in order — after EACH one, check the printer for any reaction (beep, light, paper feed, print, garbled print) before trying the next. Tell Claude the result of each one, even "nothing happened."</p>
  <button id="connectBtn">1. Connect to Printer</button>

  <div class="divider">Trials (try in order)</div>
  <button class="trial" id="trialInitOnly" disabled>A. Send init only (ESC @) — no image, just see if it reacts at all</button>
  <button class="trial" id="trialA" disabled>B. Init + raster @ 384px wide (first attempt, repeated)</button>
  <button class="trial" id="trialB" disabled>C. Init + raster @ 576px wide</button>
  <button class="trial" id="trialC" disabled>D. Raster only @ 576px, NO init command</button>

  <div id="log"></div>
  <canvas id="workCanvas"></canvas>

<script>
  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  let device = null;
  let writeChar = null;

  const CANDIDATE_SERVICES = [
    0xff00, 0xff20, 0xae30,
    '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  ];

  const trialButtons = ['trialInitOnly', 'trialA', 'trialB', 'trialC'];

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      if (!navigator.bluetooth) {
        log('navigator.bluetooth is not available in this browser. Must use Chrome on Android.', 'err');
        return;
      }
      log('Requesting device... (pick the M260)', 'info');
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: CANDIDATE_SERVICES,
      });
      log('Picked: ' + device.name, 'ok');
      device.addEventListener('gattserverdisconnected', () => log('Disconnected.', 'err'));

      const server = await device.gatt.connect();
      log('GATT connected.', 'ok');

      const services = await server.getPrimaryServices();
      log('Found ' + services.length + ' service(s).', 'ok');

      for (const service of services) {
        log('SERVICE: ' + service.uuid);
        let chars;
        try {
          chars = await service.getCharacteristics();
        } catch (e) {
          log('  (could not read characteristics: ' + e.message + ')', 'err');
          continue;
        }
        for (const ch of chars) {
          const props = [];
          if (ch.properties.write) props.push('write');
          if (ch.properties.writeWithoutResponse) props.push('writeWithoutResponse');
          if (ch.properties.notify) props.push('notify');
          log('  CHAR: ' + ch.uuid + '  [' + props.join(', ') + ']');
          if (!writeChar && (ch.properties.write || ch.properties.writeWithoutResponse)) {
            writeChar = ch;
            log('    -> using this as WRITE target', 'ok');
          }
        }
      }

      if (writeChar) {
        trialButtons.forEach(id => document.getElementById(id).disabled = false);
        log('Ready — run trials A through D in order, checking the printer after each.', 'ok');
      } else {
        log('No writable characteristic found.', 'err');
      }
    } catch (e) {
      log('ERROR: ' + e.message, 'err');
    }
  });

  async function sendBytes(payload, label) {
    log('Sending ' + payload.length + ' bytes (' + label + ')...', 'info');
    const CHUNK = 180;
    for (let i = 0; i < payload.length; i += CHUNK) {
      const chunk = payload.slice(i, i + CHUNK);
      if (writeChar.properties.writeWithoutResponse) {
        await writeChar.writeValueWithoutResponse(chunk);
      } else {
        await writeChar.writeValue(chunk);
      }
      // Small pause between chunks — some cheap BLE printer stacks drop
      // packets sent back-to-back with no gap at all.
      await new Promise(r => setTimeout(r, 15));
    }
    log('  done sending ' + label + '.', 'ok');
  }

  function buildRaster(widthPx, heightPx) {
    const canvas = document.getElementById('workCanvas');
    canvas.width = widthPx;
    canvas.height = heightPx;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, widthPx, heightPx);
    ctx.fillStyle = '#000';
    ctx.fillRect(4, 4, widthPx - 8, heightPx - 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(8, 8, widthPx - 16, heightPx - 16);
    ctx.fillStyle = '#000';
    ctx.font = 'bold ' + Math.round(widthPx / 14) + 'px sans-serif';
    ctx.fillText('HUMMUS FIT', 20, Math.round(heightPx * 0.42));
    ctx.font = 'bold ' + Math.round(widthPx / 20) + 'px sans-serif';
    ctx.fillText('BT TEST', 20, Math.round(heightPx * 0.72));

    const imgData = ctx.getImageData(0, 0, widthPx, heightPx);
    const bytesPerRow = Math.ceil(widthPx / 8);
    const raster = new Uint8Array(bytesPerRow * heightPx);
    for (let y = 0; y < heightPx; y++) {
      for (let x = 0; x < widthPx; x++) {
        const idx = (y * widthPx + x) * 4;
        const luminance = (imgData.data[idx] + imgData.data[idx + 1] + imgData.data[idx + 2]) / 3;
        if (luminance < 128) {
          const byteIndex = y * bytesPerRow + (x >> 3);
          const bitIndex = 7 - (x % 8);
          raster[byteIndex] |= (1 << bitIndex);
        }
      }
    }
    return { raster, bytesPerRow, heightPx };
  }

  function rasterCommand(widthPx, heightPx) {
    const { raster, bytesPerRow } = buildRaster(widthPx, heightPx);
    // ESC/POS: GS v 0 m xL xH yL yH [data]
    const header = new Uint8Array([
      0x1d, 0x76, 0x30, 0x00,
      bytesPerRow & 0xff, (bytesPerRow >> 8) & 0xff,
      heightPx & 0xff, (heightPx >> 8) & 0xff,
    ]);
    const full = new Uint8Array(header.length + raster.length);
    full.set(header, 0);
    full.set(raster, header.length);
    return full;
  }

  const ESC_INIT = new Uint8Array([0x1b, 0x40]); // ESC @ — standard ESC/POS "initialize printer"

  document.getElementById('trialInitOnly').addEventListener('click', async () => {
    if (!writeChar) return log('Connect first.', 'err');
    try {
      await sendBytes(ESC_INIT, 'ESC @ init only');
      log('If the printer beeped, blinked, or fed paper just now, ESC/POS commands ARE reaching it — the issue is the raster format. If NOTHING happened at all, this may not be the right characteristic/protocol.', 'ok');
    } catch (e) { log('ERROR: ' + e.message, 'err'); }
  });

  document.getElementById('trialA').addEventListener('click', async () => {
    if (!writeChar) return log('Connect first.', 'err');
    try {
      await sendBytes(ESC_INIT, 'init');
      await new Promise(r => setTimeout(r, 200));
      await sendBytes(rasterCommand(384, 120), 'raster 384px + init');
    } catch (e) { log('ERROR: ' + e.message, 'err'); }
  });

  document.getElementById('trialB').addEventListener('click', async () => {
    if (!writeChar) return log('Connect first.', 'err');
    try {
      await sendBytes(ESC_INIT, 'init');
      await new Promise(r => setTimeout(r, 200));
      await sendBytes(rasterCommand(576, 160), 'raster 576px + init');
    } catch (e) { log('ERROR: ' + e.message, 'err'); }
  });

  document.getElementById('trialC').addEventListener('click', async () => {
    if (!writeChar) return log('Connect first.', 'err');
    try {
      await sendBytes(rasterCommand(576, 160), 'raster 576px, NO init');
    } catch (e) { log('ERROR: ' + e.message, 'err'); }
  });
</script>
</body>
</html>
