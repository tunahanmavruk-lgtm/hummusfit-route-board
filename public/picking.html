<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hummus Fit — Picking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --card-2:#F1F0EC;
    --line:rgba(20,19,17,0.10);
    --ink:#141311;
    --dim:#7A776E;
    --teal:#1FA98F;
    --teal-glow: rgba(31,169,143,0.22);
    --orange:#E8612C;
    --orange-glow: rgba(232,97,44,0.20);
    --red:#DA4A3F;
    --red-glow: rgba(218,74,63,0.20);
  }
  /* Out-of-state / B2B mode — swaps the accent from teal to a warm gold
     on a light cream tint, so it's unmistakable at a glance that this
     is NOT a local store order, while staying just as clean/light as
     the rest of the interface. */
  body.b2b-mode{
    --teal:#B8860B;
    --teal-glow: rgba(184,134,11,0.22);
    --bg:#FBF6EC;
  }
  body.b2b-mode::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 10% 0%, rgba(184,134,11,0.10), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(232,97,44,0.06), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; height:100%;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(232,97,44,0.06), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(31,169,143,0.07), transparent 40%),
      var(--bg);
    padding-bottom: 60px;
    min-height:100vh;
  }
  ::selection{ background: var(--orange); color:#fff; }

  header{
    padding: max(20px, env(safe-area-inset-top)) 5vw 20px;
    border-bottom: 1.5px solid var(--ink);
    position: sticky;
    top:0;
    background: rgba(247,246,243,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 50;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 6px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--orange);
    box-shadow: 0 0 8px var(--orange-glow);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing:0.01em;
    color: var(--ink);
  }
  h1 span{ color: var(--orange); }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--dim);
    text-decoration:none;
  }

  main{ max-width: 720px; margin:0 auto; padding: 18px 5vw 0; }

  /* ---------- LIST VIEW ---------- */
  .stop-card{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    box-shadow: 0 1px 2px rgba(20,19,17,0.03), 0 6px 18px rgba(20,19,17,0.05);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .stop-card:active{ transform: scale(0.98); }
  .stop-card.complete{ border-color: rgba(31,169,143,0.45); }
  .stop-info{ flex:1; min-width:0; }
  .stop-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing:0.01em;
    text-transform: capitalize;
    color: var(--ink);
  }
  .stop-order{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--dim);
    margin-top:2px;
  }
  .stop-progress-ring{
    width: 56px; height:56px;
    flex-shrink:0;
    position:relative;
  }
  .stop-progress-ring svg{ transform: rotate(-90deg); }
  .stop-progress-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: var(--ink);
  }
  .stop-badge-complete{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding: 4px 10px;
    border-radius:999px;
    background: rgba(31,169,143,0.12);
    color: var(--teal);
  }

  .stop-card.b2b{
    border-color: rgba(184,134,11,0.4);
    background: linear-gradient(135deg, rgba(184,134,11,0.05), var(--card) 60%);
  }
  .b2b-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding: 4px 10px;
    border-radius:999px;
    background: rgba(184,134,11,0.14);
    color: #8A6508;
    margin-top:8px;
  }
  .b2b-tag::before{ content:"⬢"; font-size:10px; }

  .b2b-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background: linear-gradient(90deg, rgba(184,134,11,0.12), rgba(232,97,44,0.06));
    border: 1.5px solid rgba(184,134,11,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: #8A6508;
  }
  .b2b-banner .icon{ font-size:18px; }

  .empty-state{
    text-align:center;
    padding: 60px 24px;
    color: var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    line-height:1.8;
  }

  /* ---------- ORDER DETAIL VIEW ---------- */
  .order-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom: 18px;
  }
  .order-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    text-transform:capitalize;
    color: var(--ink);
  }
  .order-sub{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--dim);
    margin-top:4px;
  }
  .order-total-progress{
    text-align:right;
    flex-shrink:0;
  }
  .order-total-count{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    color: var(--orange);
  }
  .order-total-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--dim);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .picker-badge-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom: 14px;
  }
  .picker-badge{
    display:flex;
    align-items:center;
    gap:9px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    box-shadow: 0 1px 2px rgba(20,19,17,0.04);
  }
  .picker-avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink:0;
  }
  .picker-avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--ink);
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 12px;
  }
  .picker-badge-text{ line-height:1.25; }
  .picker-badge-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color: var(--dim);
  }
  .picker-badge-name{
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink);
  }

  .scanner-ready-hint{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    color: var(--teal);
    margin-bottom: 14px;
  }
  .scanner-ready-hint .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal-glow);
  }

  .picker-row{
    margin-bottom: 18px;
  }
  .picker-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .picker-select{
    width:100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 15px;
    outline:none;
  }
  .picker-select:focus{ border-color: var(--orange); }

  .completed-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background: rgba(31,169,143,0.10);
    border: 1.5px solid rgba(31,169,143,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--teal);
  }
  .reopen-link{
    margin-left:auto;
    text-decoration:underline;
    color: var(--dim);
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }

  .scan-btn{
    flex-shrink:0;
    width: 48px; height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--card-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 19px;
    cursor:pointer;
    color: var(--dim);
  }
  .scan-btn:active{ transform: scale(0.9); }

  .finish-btn{
    width:100%;
    padding: 18px;
    border-radius: 14px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 14px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    border: none;
    background: var(--orange);
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(232,97,44,0.3);
  }
  .finish-btn:disabled{
    opacity: 0.3;
    cursor: default;
    box-shadow:none;
  }
  .crate-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background: var(--card-2);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .crate-info{
    font-size: 13px;
    color: var(--ink);
  }
  .closed-crates-note{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--teal);
    margin: -6px 0 14px;
  }

  #crateFab{
    position: fixed;
    right: 18px;
    bottom: calc(100px + env(safe-area-inset-bottom));
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: var(--ink);
    color: #fff;
    box-shadow: 0 8px 24px rgba(20,19,17,0.4);
    cursor: pointer;
    padding: 0;
  }
  #crateFab:active{ transform: scale(0.94); }
  #crateFab:disabled{
    opacity: 0.35;
    cursor: default;
  }
  #crateFab .fab-icon{
    font-size: 18px;
    line-height:1;
    margin-bottom: 2px;
  }
  #crateFab .fab-count{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    line-height:1;
  }

  .finish-hint{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    margin: -4px 0 14px;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(20,19,17,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 200;
    padding: 24px;
  }
  .modal-box{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 380px;
    width:100%;
    box-shadow: 0 20px 60px rgba(20,19,17,0.25);
  }
  .print-modal-box{
    max-width: 420px;
  }
  .print-preview-frame{
    width: 100%;
    height: 50vh;
    min-height: 320px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin: 14px 0;
    background: #fff;
  }
  .modal-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .modal-stat-row{
    display:flex;
    justify-content:space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    color: var(--ink);
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top: 20px;
  }
  .modal-btn{
    flex:1;
    padding: 14px;
    border-radius: 12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 12.5px;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    border: 1.5px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
  }
  .modal-btn.confirm{
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
  }

  #scannerOverlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index: 300;
    display:flex;
    flex-direction:column;
  }
  #scannerOverlay .scanner-header{
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
  }
  #scannerOverlay .scanner-close{
    font-size: 22px;
    color:#fff;
    cursor:pointer;
    padding: 4px 10px;
  }
  #reader{ flex:1; }

  .item-card{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    gap: 16px;
    box-shadow: 0 1px 2px rgba(20,19,17,0.03), 0 4px 14px rgba(20,19,17,0.04);
    transition: border-color .15s ease, background .15s ease;
  }
  .item-card.picked{ border-color: rgba(31,169,143,0.45); background: linear-gradient(90deg, rgba(31,169,143,0.06), var(--card) 40%); }
  .item-card.missing{ border-color: rgba(218,74,63,0.45); background: linear-gradient(90deg, rgba(218,74,63,0.06), var(--card) 40%); }
  .item-card.partial{ border-color: rgba(200,140,20,0.5); background: linear-gradient(90deg, rgba(200,140,20,0.08), var(--card) 40%); }

  .item-qty{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--dim);
    width: 44px;
    flex-shrink:0;
    text-align:center;
  }
  .item-card.picked .item-qty{ color: var(--teal); }
  .item-card.missing .item-qty{ color: var(--red); }
  .item-card.partial .item-qty{ color: #B8860B; }

  .item-info{ flex:1; min-width:0; }
  .item-title{ font-size: 15.5px; font-weight:600; line-height:1.3; color: var(--ink); }
  .item-status-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color: var(--dim);
    margin-top:3px;
  }
  .item-card.picked .item-status-label{ color: var(--teal); }
  .item-card.missing .item-status-label{ color: var(--red); }
  .item-card.partial .item-status-label{ color: #B8860B; }

  .partial-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    text-decoration:underline;
    margin-top: 5px;
    cursor:pointer;
  }

  .tap-btn{
    flex-shrink:0;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    background: var(--card-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 26px;
    cursor:pointer;
    transition: all .15s cubic-bezier(0.34,1.56,0.64,1);
    color: var(--dim);
  }
  .tap-btn:active{ transform: scale(0.88); }
  .item-card.picked .tap-btn{
    border-color: var(--teal);
    background: rgba(31,169,143,0.12);
    color: var(--teal);
    box-shadow: 0 4px 16px var(--teal-glow);
  }
  .item-card.missing .tap-btn{
    border-color: var(--red);
    background: rgba(218,74,63,0.12);
    color: var(--red);
    box-shadow: 0 4px 16px var(--red-glow);
  }
  .item-card.partial .tap-btn{
    border-color: #B8860B;
    background: rgba(184,134,11,0.12);
    color: #B8860B;
    box-shadow: 0 4px 16px rgba(184,134,11,0.22);
  }

  .missing-note-row{
    margin: -4px 0 12px;
    padding: 0 4px;
  }
  .missing-note-row input{
    width:100%;
    background: var(--card);
    border: 1.5px solid rgba(218,74,63,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 13px;
    outline:none;
  }
  .missing-note-row input::placeholder{ color: var(--dim); }

  .bottom-bar{
    position: sticky;
    bottom: 0;
    background: rgba(247,246,243,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1.5px solid var(--ink);
    padding: 16px 5vw max(16px, env(safe-area-inset-bottom));
    display:flex;
    gap: 10px;
    margin: 20px -5vw 0;
  }
  .big-btn{
    flex:1;
    padding: 16px;
    border-radius: 14px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    transition: transform .12s ease;
  }
  .big-btn:active{ transform: scale(0.97); }
  .big-btn.primary{
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }
  .big-btn.danger{
    background: rgba(218,74,63,0.10);
    color: var(--red);
    border-color: rgba(218,74,63,0.4);
  }
  .big-btn:disabled, .big-btn.disabled{
    opacity:0.35;
    pointer-events:none;
  }
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span>Hummus Fit / Warehouse</div>
  <h1 id="pageTitle">PICK <span>LIST</span></h1>
  <a class="back-link" id="backLink" href="#" style="display:none;">&larr; All Orders</a>
</header>

<main id="mainContent">
  <div class="empty-state">Loading…</div>
</main>

<div id="modalContainer"></div>
<div id="scannerOverlay" style="display:none;">
  <div class="scanner-header">
    <span>Scan item barcode</span>
    <span class="scanner-close" id="scannerCloseBtn">✕</span>
  </div>
  <div id="reader"></div>
</div>

<!-- Invisible input that captures real Bluetooth scanner "keyboard"
     input. A paired hardware scanner types the barcode into whatever
     text field is focused, then sends Enter — this field stays
     silently focused during picking so a scan works no matter what
     the picker is looking at on screen, no button tap required. -->
<input type="text" id="hwScanInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
  style="position:fixed; top:-100px; left:-100px; width:1px; height:1px; opacity:0; pointer-events:none;">

<!-- Floating "New Crate" button — lives outside the scrolling item
     list entirely, always reachable regardless of order size, so a
     70-item order never needs scrolling to the bottom just to close
     out a crate. -->
<button id="crateFab" style="display:none;">
  <span class="fab-icon">📦</span>
  <span class="fab-count" id="crateFabCount">0</span>
</button>

<script>
(function(){
  var view = 'list';
  var pickingList = [];
  var orderDetail = null;
  var scanningForIdx = null;
  var html5QrCode = null;

  function ringSvg(picked, missing, total){
    var done = picked + missing;
    var pct = total > 0 ? done / total : 0;
    var r = 24, c = 2 * Math.PI * r;
    var offset = c * (1 - pct);
    var color = pct >= 1 ? 'var(--teal)' : 'var(--orange)';
    return '<svg width="56" height="56" viewBox="0 0 56 56">' +
      '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>' +
      '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round" ' +
        'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" style="transition: stroke-dashoffset .4s ease;"/>' +
      '</svg>';
  }

  function renderList(){
    view = 'list';
    document.body.classList.remove('b2b-mode');
    document.getElementById('pageTitle').innerHTML = 'PICK <span>LIST</span>';
    document.getElementById('backLink').style.display = 'none';
    updateCrateFab();
    var main = document.getElementById('mainContent');

    if(pickingList.length === 0){
      main.innerHTML = '<div class="empty-state">No orders in the current picking window yet.<br>Check back once today\'s orders start coming in.</div>';
      return;
    }

    var html = '';
    pickingList.forEach(function(stop){
      var done = stop.pickedCount + stop.missingCount;
      var cardClass = 'stop-card' + (stop.isComplete ? ' complete' : '') + (stop.isB2B ? ' b2b' : '');
      html +=
        '<div class="' + cardClass + '" data-stop="' + stop.stopName + '">' +
          '<div class="stop-info">' +
            '<div class="stop-name">' + stop.stopName + '</div>' +
            '<div class="stop-order">' + stop.orderName + ' — ' + done + '/' + stop.totalItems + ' items</div>' +
            (stop.isB2B ? '<div class="b2b-tag">Out of State</div>' : '') +
            (stop.isComplete ? '<div class="stop-badge-complete" style="margin-top:8px; display:inline-block;">Complete</div>' : '') +
          '</div>' +
          '<div class="stop-progress-ring">' + ringSvg(stop.pickedCount, stop.missingCount, stop.totalItems) +
            '<div class="stop-progress-label">' + done + '/' + stop.totalItems + '</div>' +
          '</div>' +
        '</div>';
    });
    main.innerHTML = html;

    document.querySelectorAll('.stop-card').forEach(function(card){
      card.addEventListener('click', function(){
        openOrder(card.dataset.stop);
      });
    });
  }

  function nextItemStatus(current){
    if(current === 'picked') return 'missing';
    if(current === 'missing') return 'not_picked';
    return 'picked';
  }

  // ---- Finish confirmation modal ----
  function closeModal(){
    document.getElementById('modalContainer').innerHTML = '';
  }

  function showFinishConfirmation(picked, missing, partial, total){
    var html =
      '<div class="modal-overlay" id="finishModalOverlay">' +
        '<div class="modal-box">' +
          '<div class="modal-title">Finish Order?</div>' +
          '<div class="modal-stat-row"><span>Picked</span><span>' + picked + '</span></div>' +
          '<div class="modal-stat-row"><span>Partial (short)</span><span>' + partial + '</span></div>' +
          '<div class="modal-stat-row"><span>Missing</span><span>' + missing + '</span></div>' +
          '<div class="modal-stat-row"><span>Total items</span><span>' + total + '</span></div>' +
          '<div class="modal-actions">' +
            '<div class="modal-btn" id="modalCancelBtn">Cancel</div>' +
            '<div class="modal-btn confirm" id="modalConfirmBtn">Confirm &amp; Finish</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalContainer').innerHTML = html;

    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('finishModalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'finishModalOverlay') closeModal();
    });
    document.getElementById('modalConfirmBtn').addEventListener('click', function(){
      fetch('/api/picking-finish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stopName: orderDetail.stopName })
      }).then(function(r){
        return r.json().then(function(data){ return { ok: r.ok, data: data }; });
      }).then(function(result){
        closeModal();
        if(!result.ok || result.data.error){
          alert(result.data.error || 'Could not finish this order.');
          return;
        }
        orderDetail.completedAt = result.data.completedAt;
        orderDetail.completedBy = result.data.completedBy;
        if(result.data.closedCrates){ orderDetail.closedCrates = result.data.closedCrates; }
        renderOrder();
        // Print the final crate's label too, so every crate has one by
        // the time the order is done — even if "New Crate" was never
        // tapped for this last box.
        if(result.data.finalCrateNumber){
          printPdfInPlace('/api/crate-label/' + encodeURIComponent(orderDetail.stopName) + '/' + result.data.finalCrateNumber);
        }
      }).catch(function(err){
        closeModal();
        alert('Could not reach the server: ' + err.message);
      });
    });
  }

  // ---- Barcode scanning ----
  function openScanner(idx){
    scanningForIdx = idx;
    document.getElementById('scannerOverlay').style.display = 'flex';
    if(typeof Html5Qrcode === 'undefined'){
      alert('Barcode scanner failed to load. Check your connection and try again.');
      closeScanner();
      return;
    }
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 160 } },
      function(decodedText){
        handleScanResult(decodedText);
      },
      function(){ /* ignore per-frame scan misses */ }
    ).catch(function(err){
      alert('Could not access the camera: ' + err);
      closeScanner();
    });
  }

  function closeScanner(){
    document.getElementById('scannerOverlay').style.display = 'none';
    if(html5QrCode){
      html5QrCode.stop().catch(function(){}).then(function(){
        html5QrCode.clear();
        html5QrCode = null;
      });
    }
    scanningForIdx = null;
  }

  function handleScanResult(scannedCode){
    if(scanningForIdx === null) return;
    var idx = scanningForIdx;
    var item = orderDetail.lineItems[idx];
    var expectedSku = (item.sku || '').trim();
    var scanned = (scannedCode || '').trim();

    closeScanner();

    if(!expectedSku){
      // No SKU on file for this item — can't verify, but let the picker
      // proceed manually rather than blocking them on missing catalog data.
      alert('No barcode on file for this item yet — mark it picked manually.');
      return;
    }

    if(scanned === expectedSku){
      orderDetail.itemStatus[idx] = 'picked';
      renderOrder();
      fetch('/api/picking-item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: idx, status: 'picked' })
      });
    } else {
      alert('That barcode doesn\'t match "' + item.title + '". Double-check you grabbed the right item.');
    }
  }

  document.getElementById('scannerCloseBtn').addEventListener('click', closeScanner);

  // ---- Floating "New Crate" button ----
  // Wired once, lives outside the re-rendered content, so it stays
  // reachable and functional no matter how far down a long order the
  // picker has scrolled.
  var crateFabEl = document.getElementById('crateFab');
  var crateFabCountEl = document.getElementById('crateFabCount');

  function updateCrateFab(){
    if(view !== 'order' || !orderDetail || orderDetail.completedAt){
      crateFabEl.style.display = 'none';
      return;
    }
    var itemsInCurrentCrate = orderDetail.lineItems.filter(function(item, idx){
      return orderDetail.itemCrateNumber && orderDetail.itemCrateNumber[idx] === orderDetail.currentCrateNumber;
    }).length;
    crateFabEl.style.display = 'flex';
    crateFabEl.disabled = itemsInCurrentCrate === 0;
    crateFabCountEl.textContent = itemsInCurrentCrate;
  }

  crateFabEl.addEventListener('click', function(){
    if(!orderDetail) return;
    crateFabEl.disabled = true;
    fetch('/api/picking-new-crate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stopName: orderDetail.stopName })
    }).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(result){
      if(!result.ok || result.data.error){
        alert(result.data.error || 'Could not close this crate.');
        updateCrateFab();
        return;
      }
      orderDetail.closedCrates = orderDetail.closedCrates || [];
      orderDetail.closedCrates.push(result.data.closedCrateNumber);
      orderDetail.currentCrateNumber = result.data.currentCrateNumber;
      renderOrder();
      // Print the just-closed crate's label directly, right on this
      // screen — no tab switch, tap Print and keep picking.
      printPdfInPlace('/api/crate-label/' + encodeURIComponent(orderDetail.stopName) + '/' + result.data.closedCrateNumber);
    }).catch(function(err){
      alert('Could not reach the server: ' + err.message);
      updateCrateFab();
    });
  });

  // ---- Real Bluetooth (hardware) scanner support ----
  // A paired Bluetooth scanner acts like a keyboard: it types the
  // barcode into this invisible field, then sends Enter automatically.
  // Unlike the camera flow, no item needs to be pre-selected — the
  // picker just scans whatever product is in their hand, and the
  // system finds which line item it matches.
  var hwScanInputEl = document.getElementById('hwScanInput');

  // Prints a PDF (a crate label) directly from the current screen —
  // no new tab, no navigating away. Loads it into a hidden iframe and
  // triggers the browser's native print dialog right on top of
  // whatever the picker's already looking at; once they tap Print (or
  // cancel), they're right back where they left off, mid-order.
  function printPdfInPlace(url){
    var html =
      '<div class="modal-overlay" id="printModalOverlay">' +
        '<div class="modal-box print-modal-box">' +
          '<div class="modal-title">Ready to Print</div>' +
          '<iframe id="printPreviewFrame" class="print-preview-frame" src="' + url + '"></iframe>' +
          '<div class="modal-actions">' +
            '<div class="modal-btn" id="printModalCloseBtn">Close</div>' +
            '<div class="modal-btn confirm" id="printModalPrintBtn">Print</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalContainer').innerHTML = html;

    function closePrintModal(){
      document.getElementById('modalContainer').innerHTML = '';
    }

    document.getElementById('printModalCloseBtn').addEventListener('click', closePrintModal);
    document.getElementById('printModalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'printModalOverlay') closePrintModal();
    });
    document.getElementById('printModalPrintBtn').addEventListener('click', function(){
      // By this point the picker has actually seen the label rendered
      // on screen, so the PDF has genuinely finished loading — that's
      // what was causing blank pages before, calling print() before
      // the PDF viewer had actually painted anything yet.
      var frame = document.getElementById('printPreviewFrame');
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch(e){
        window.open(url, '_blank');
      }
    });
  }

  function focusHwScanInput(){
    if(view === 'order' && orderDetail && !orderDetail.completedAt){
      hwScanInputEl.focus();
    }
  }

  hwScanInputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      var code = hwScanInputEl.value.trim();
      hwScanInputEl.value = '';
      if(code){ handleHardwareScan(code); }
    }
  });

  // iOS Safari can drop focus after alerts, taps elsewhere, or the app
  // being backgrounded — keep pulling it back so a physical scan works
  // at any moment without the picker having to tap anything first.
  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'hwScanInput') return;
    setTimeout(focusHwScanInput, 50);
  });
  window.addEventListener('focus', function(){ setTimeout(focusHwScanInput, 50); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(focusHwScanInput, 50);
  });

  function handleHardwareScan(scannedCode){
    if(!orderDetail || !orderDetail.lineItems) return;

    var matchIdx = -1;
    for(var i = 0; i < orderDetail.lineItems.length; i++){
      var item = orderDetail.lineItems[i];
      var expectedSku = (item.sku || '').trim();
      var currentStatus = orderDetail.itemStatus[i] || 'not_picked';
      if(expectedSku && expectedSku === scannedCode && currentStatus !== 'picked'){
        matchIdx = i;
        break;
      }
    }

    if(matchIdx === -1){
      var alreadyPicked = orderDetail.lineItems.some(function(item, i){
        return (item.sku || '').trim() === scannedCode && (orderDetail.itemStatus[i] === 'picked');
      });
      if(alreadyPicked){
        alert('That item is already marked picked.');
      } else {
        alert('Scanned code doesn\'t match any item in this order. Double-check you grabbed the right product.');
      }
      focusHwScanInput();
      return;
    }

    orderDetail.itemStatus[matchIdx] = 'picked';
    orderDetail.itemCrateNumber = orderDetail.itemCrateNumber || {};
    orderDetail.itemCrateNumber[matchIdx] = orderDetail.currentCrateNumber;
    renderOrder();
    fetch('/api/picking-item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: matchIdx, status: 'picked' })
    });
  }

  function renderOrder(){
    view = 'order';
    document.getElementById('pageTitle').textContent = orderDetail.stopName;
    document.getElementById('backLink').style.display = 'inline-flex';
    var main = document.getElementById('mainContent');

    document.body.classList.toggle('b2b-mode', Boolean(orderDetail.isB2B));

    var picked = 0, missing = 0, partial = 0, notPicked = 0;
    orderDetail.lineItems.forEach(function(item, idx){
      var s = orderDetail.itemStatus[idx] || 'not_picked';
      if(s === 'picked') picked++;
      else if(s === 'missing') missing++;
      else if(s === 'partial') partial++;
      else notPicked++;
    });
    var total = orderDetail.lineItems.length;
    var done = picked + missing + partial;
    var isLocked = Boolean(orderDetail.completedAt);

    var html = '';
    if(orderDetail.isB2B){
      html += '<div class="b2b-banner"><span class="icon">⬢</span> Out-of-State / B2B Order — different from local store picking</div>';
    }

    if(isLocked){
      html +=
        '<div class="completed-banner">' +
          '✓ Finished by ' + orderDetail.completedBy + ' — ' + fmtTime(orderDetail.completedAt) +
          '<span class="reopen-link" id="reopenLink">Reopen</span>' +
        '</div>';
    }

    html +=
      '<div class="order-header">' +
        '<div>' +
          '<div class="order-title">' + orderDetail.orderName + '</div>' +
          '<div class="order-sub">' + orderDetail.stopName + '</div>' +
        '</div>' +
        '<div class="order-total-progress">' +
          '<div class="order-total-count">' + done + '/' + total + '</div>' +
          '<div class="order-total-label">Reviewed</div>' +
        '</div>' +
      '</div>';

    if(orderDetail.pickedBy){
      var initials = orderDetail.pickedBy.split(/[\s,]+/).filter(Boolean).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
      var avatarHtml = orderDetail.pickedByPhoto
        ? '<img class="picker-avatar" src="' + orderDetail.pickedByPhoto + '" alt="">'
        : '<div class="picker-avatar picker-avatar-fallback">' + initials + '</div>';
      html +=
        '<div class="picker-badge-row">' +
          '<div class="picker-badge">' +
            avatarHtml +
            '<div class="picker-badge-text">' +
              '<div class="picker-badge-label">' + (isLocked ? 'Picked by' : 'Currently picking') + '</div>' +
              '<div class="picker-badge-name">' + orderDetail.pickedBy + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    if(!isLocked){
      html += '<div class="scanner-ready-hint"><span class="dot"></span>Bluetooth scanner ready — scan any item, no tap needed</div>';
      html +=
        '<div class="picker-row">' +
          '<div class="picker-label">Who\'s picking this order</div>' +
          '<select class="picker-select" id="pickerSelect">' +
            '<option value="">— Select your name —</option>' +
            (orderDetail.pickers || []).map(function(p){
              return '<option value="' + p + '"' + (p === orderDetail.pickedBy ? ' selected' : '') + '>' + p + '</option>';
            }).join('') +
          '</select>' +
        '</div>';
    }

    orderDetail.lineItems.forEach(function(item, idx){
      var status = orderDetail.itemStatus[idx] || 'not_picked';
      var pickedQty = (orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined) ? orderDetail.itemPickedQty[idx] : null;
      var icon = status === 'picked' ? '✓' : (status === 'missing' ? '✕' : (status === 'partial' ? '½' : ''));
      var label = status === 'picked' ? 'Picked' :
        (status === 'missing' ? 'Missing' :
        (status === 'partial' ? 'Short — ' + pickedQty + ' of ' + item.quantity + ' picked' : 'Tap when picked'));
      var qtyDisplay = (status === 'partial' && pickedQty !== null) ? (pickedQty + '/' + item.quantity) : item.quantity;
      html +=
        '<div class="item-card ' + status + '" data-idx="' + idx + '" style="' + (isLocked ? 'opacity:0.7;' : '') + '">' +
          '<div class="item-qty">' + qtyDisplay + '</div>' +
          '<div class="item-info">' +
            '<div class="item-title">' + item.title + '</div>' +
            '<div class="item-status-label">' + label + '</div>' +
            (isLocked ? '' : '<div class="partial-link" data-partial-idx="' + idx + '">Only had some? Enter partial quantity</div>') +
          '</div>' +
          (isLocked ? '' : '<div class="scan-btn" data-scan-idx="' + idx + '" title="Scan barcode">▤</div>') +
          '<div class="tap-btn" data-idx="' + idx + '">' + icon + '</div>' +
        '</div>';
      if(status === 'missing' || status === 'partial'){
        html +=
          '<div class="missing-note-row">' +
            '<input type="text" placeholder="Why is it short? (optional)" data-note-idx="' + idx + '" value="' +
            (orderDetail.itemNotes[idx] || '').replace(/"/g,'&quot;') + '" ' + (isLocked ? 'disabled' : '') + '>' +
          '</div>';
      }
    });

    var hasMissing = (missing + partial) > 0;
    var canFinish = !isLocked && notPicked === 0 && total > 0;

    if(!isLocked){
      var itemsInCurrentCrate = orderDetail.lineItems.filter(function(item, idx){
        return orderDetail.itemCrateNumber && orderDetail.itemCrateNumber[idx] === orderDetail.currentCrateNumber;
      }).length;
      html +=
        '<div class="crate-row">' +
          '<div class="crate-info">Currently packing: <strong>Crate ' + orderDetail.currentCrateNumber + '</strong> (' + itemsInCurrentCrate + ' item' + (itemsInCurrentCrate === 1 ? '' : 's') + ') — use the floating button, bottom right, to close it out from anywhere on the page</div>' +
        '</div>';
      if((orderDetail.closedCrates || []).length > 0){
        html += '<div class="closed-crates-note">Printed: Crate ' + orderDetail.closedCrates.join(', Crate ') + '</div>';
      }

      html += '<button class="finish-btn" id="finishBtn"' + (canFinish ? '' : ' disabled') + '>Finish Order</button>';
      if(!canFinish){
        html += '<div class="finish-hint">' +
          (notPicked > 0 ? notPicked + ' item(s) still need to be marked before you can finish' : 'Select your name to finish') +
        '</div>';
      }
    }

    html +=
      '<div class="bottom-bar">' +
        '<a class="big-btn' + (hasMissing ? ' danger' : ' disabled') + '" ' +
          (hasMissing ? 'href="/api/missing-items-pdf/' + encodeURIComponent(orderDetail.stopName) + '" target="_blank"' : '') +
          '>Missing Report</a>' +
        '<a class="big-btn primary" href="/api/packing-slip/' + encodeURIComponent(orderDetail.stopName) + '" target="_blank">Packing Slip PDF</a>' +
      '</div>';

    main.innerHTML = html;

    if(isLocked){
      var reopenEl = document.getElementById('reopenLink');
      if(reopenEl){
        reopenEl.addEventListener('click', function(){
          if(confirm('Reopen this order for editing?')){
            fetch('/api/picking-reopen', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ stopName: orderDetail.stopName })
            }).then(function(r){ return r.json(); }).then(function(){
              orderDetail.completedAt = null;
              orderDetail.completedBy = null;
              renderOrder();
            });
          }
        });
      }
    }

    var pickerEl = document.getElementById('pickerSelect');
    if(pickerEl){
      pickerEl.addEventListener('change', function(){
        orderDetail.pickedBy = pickerEl.value;
        fetch('/api/picking-set-picker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName, picker: pickerEl.value })
        }).then(function(r){ return r.json(); }).then(function(data){
          orderDetail.pickedByPhoto = data.pickedByPhoto || null;
          renderOrder();
        });
      });
    }

    var finishEl = document.getElementById('finishBtn');
    if(finishEl){
      finishEl.addEventListener('click', function(){
        showFinishConfirmation(picked, missing, partial, total);
      });
    }

    document.querySelectorAll('[data-scan-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        openScanner(parseInt(btn.dataset.scanIdx, 10));
      });
    });

    document.querySelectorAll('[data-partial-idx]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.partialIdx, 10);
        var item = orderDetail.lineItems[idx];
        var currentQty = (orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined)
          ? orderDetail.itemPickedQty[idx] : item.quantity;
        var entered = prompt('How many of "' + item.title + '" do you actually have? (Ordered: ' + item.quantity + ')', currentQty);
        if(entered === null) return; // cancelled
        var qty = parseInt(entered, 10);
        if(isNaN(qty) || qty < 0 || qty > item.quantity){
          alert('Enter a number between 0 and ' + item.quantity + '.');
          return;
        }
        var newStatus = qty === item.quantity ? 'picked' : (qty === 0 ? 'missing' : 'partial');
        orderDetail.itemStatus[idx] = newStatus;
        orderDetail.itemPickedQty = orderDetail.itemPickedQty || {};
        if(newStatus === 'partial'){
          orderDetail.itemPickedQty[idx] = qty;
        } else {
          delete orderDetail.itemPickedQty[idx];
        }
        orderDetail.itemCrateNumber = orderDetail.itemCrateNumber || {};
        if(newStatus === 'picked' || newStatus === 'partial'){
          orderDetail.itemCrateNumber[idx] = orderDetail.currentCrateNumber;
        } else {
          delete orderDetail.itemCrateNumber[idx];
        }
        renderOrder();
        fetch('/api/picking-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            stopName: orderDetail.stopName,
            itemIndex: idx,
            status: newStatus,
            pickedQty: newStatus === 'partial' ? qty : undefined
          })
        });
      });
    });

    document.querySelectorAll('.tap-btn').forEach(function(el){
      if(isLocked) return;
      el.addEventListener('click', function(){
        var idx = this.dataset.idx;
        if(idx === undefined) return;
        var current = orderDetail.itemStatus[idx] || 'not_picked';
        var next = nextItemStatus(current);
        orderDetail.itemStatus[idx] = next;
        orderDetail.itemCrateNumber = orderDetail.itemCrateNumber || {};
        if(next === 'picked' || next === 'partial'){
          orderDetail.itemCrateNumber[idx] = orderDetail.currentCrateNumber;
        } else {
          delete orderDetail.itemCrateNumber[idx];
        }
        renderOrder();
        fetch('/api/picking-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: idx, status: next })
        });
      });
    });

    document.querySelectorAll('[data-note-idx]').forEach(function(inp){
      var debounce;
      inp.addEventListener('input', function(){
        clearTimeout(debounce);
        var idx = this.dataset.noteIdx;
        var val = this.value;
        orderDetail.itemNotes[idx] = val;
        debounce = setTimeout(function(){
          fetch('/api/picking-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: idx, status: orderDetail.itemStatus[idx], note: val })
          });
        }, 500);
      });
    });

    focusHwScanInput();
    updateCrateFab();
  }

  function openOrder(stopName){
    fetch('/api/picking-order/' + encodeURIComponent(stopName))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error){ return; }
        orderDetail = data;
        renderOrder();
        window.scrollTo(0,0);
      });
  }

  document.getElementById('backLink').addEventListener('click', function(e){
    e.preventDefault();
    loadList();
  });

  function loadList(){
    fetch('/api/picking-list')
      .then(function(r){ return r.json(); })
      .then(function(data){
        pickingList = data.stops || [];
        renderList();
      })
      .catch(function(){
        document.getElementById('mainContent').innerHTML =
          '<div class="empty-state">Couldn\'t load the pick list.</div>';
      });
  }

  function poll(){
    var activeEl = document.activeElement;
    var isTyping = activeEl && activeEl.tagName === 'INPUT';
    if(isTyping) return;
    if(view === 'list'){
      loadList();
    }
  }

  // Support deep-linking straight into a specific order, e.g.
  // /picking?stop=Lindenhurst — used by the "order number" link on the
  // main Route Board so dispatch/drivers land right on that order
  // instead of having to find it in the list themselves.
  var urlParams = new URLSearchParams(window.location.search);
  var deepLinkStop = urlParams.get('stop');
  if(deepLinkStop){
    openOrder(deepLinkStop);
  } else {
    loadList();
  }
  setInterval(poll, 15000);
})();
</script>

</body>
</html>
