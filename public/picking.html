<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hummus Fit — Picking</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141311">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --card-2:#F1F0EC;
    --line:rgba(20,19,17,0.10);
    --ink:#141311;
    --dim:#7A776E;
    --teal:#1FA98F;
    --teal-glow: rgba(31,169,143,0.22);
    --teal-border: rgba(31,169,143,0.45);
    --teal-tint: rgba(31,169,143,0.06);
    --teal-tint-strong: rgba(31,169,143,0.12);
    --orange:#E8612C;
    --orange-glow: rgba(232,97,44,0.20);
    --red:#DA4A3F;
    --red-glow: rgba(218,74,63,0.20);
  }
  /* Out-of-state / B2B mode — swaps the accent from teal to a warm gold
     on a light cream tint, so it's unmistakable at a glance that this
     is NOT a local store order, while staying just as clean/light as
     the rest of the interface. */
  body.b2b-mode{
    --teal:#6FA83C;
    --teal-glow: rgba(111,168,60,0.25);
    --teal-border: rgba(111,168,60,0.45);
    --teal-tint: rgba(111,168,60,0.07);
    --teal-tint-strong: rgba(111,168,60,0.13);
    --bg:#FFFFFF;
  }
  body.b2b-mode::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 10% 0%, rgba(111,168,60,0.08), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(20,19,17,0.04), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; height:100%;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(232,97,44,0.06), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(31,169,143,0.07), transparent 40%),
      var(--bg);
    padding-bottom: 60px;
    min-height:100vh;
  }
  ::selection{ background: var(--orange); color:#fff; }

  #cratePrintSheet{ display:none; }
  @page{ size:4in 3in; margin:0; }
  @media print{
    body > *{ display:none!important; }
    html,body{ width:4in!important; height:auto!important; min-height:0!important; margin:0!important; padding:0!important; background:#fff!important; }
    body::before{ display:none!important; }
    #cratePrintSheet{
      display:block!important; position:static!important;
      width:4in!important; height:auto!important; box-sizing:border-box!important;
      padding:0!important; color:#111!important; background:#fff!important;
      font-family:Arial,sans-serif!important;
    }
    #cratePrintSheet *{ box-sizing:border-box!important; }
    .crate-label-page{ width:4in; height:3in; position:relative; break-after:page; page-break-after:always; overflow:hidden; background:white; }
    .crate-label-page:last-child{ break-after:auto; page-break-after:auto; }
    .crate-label-frame{ position:absolute; inset:.06in; border:2px solid #111; }
    .crate-label-bar{ position:absolute; left:.07in; right:.07in; top:.07in; height:.305in; background:#111; color:white; display:flex; align-items:center; justify-content:space-between; padding:0 .08in; font-size:.135in; font-weight:800; overflow:hidden; white-space:nowrap; }
    .crate-label-pattern{ position:absolute; left:.15in; top:.45in; width:.11in; height:.78in; background:repeating-linear-gradient(145deg,#111 0 3px,#fff 3px 10px); border-right:1px solid #111; }
    .crate-label-pattern.dots{ background:radial-gradient(circle,#111 30%,white 32%) 0 0/9px 9px; }
    .crate-label-pattern.chevron{ background:repeating-linear-gradient(135deg,#111 0 2px,#fff 2px 10px); }
    .crate-label-store{ position:absolute; left:.36in; top:.56in; width:2.45in; height:.55in; display:flex; align-items:center; font-weight:900; line-height:1; overflow-wrap:anywhere; }
    .crate-label-crate{ position:absolute; left:2.88in; top:.45in; width:.96in; height:.79in; border:3px solid #111; text-align:center; font-weight:900; }
    .crate-label-crate small{ display:block; font-size:.14in; margin-top:.03in; }
    .crate-label-crate strong{ display:block; font-size:.44in; line-height:1; margin-top:.08in; }
    .crate-label-meta{ position:absolute; left:.15in; right:.15in; top:1.29in; height:.29in; border-top:2px solid #111; border-bottom:1px solid #111; display:flex; justify-content:space-between; align-items:center; font-size:.105in; font-weight:700; }
    .crate-label-contents{ position:absolute; left:.15in; right:.15in; top:1.59in; display:flex; justify-content:space-between; font-size:.09in; font-weight:800; }
    .crate-label-item{ position:absolute; white-space:normal; line-height:1.08; font-weight:700; overflow:hidden; }
    .crate-label-item b{ float:left; width:.23in; }
    .crate-label-item span{ display:block; margin-left:.2in; }
  }

  header{
    padding: max(20px, env(safe-area-inset-top)) 5vw 20px;
    border-bottom: 1.5px solid var(--ink);
    position: sticky;
    top:0;
    background: rgba(247,246,243,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 50;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 6px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--orange);
    box-shadow: 0 0 8px var(--orange-glow);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing:0.01em;
    color: var(--ink);
  }
  h1 span{ color: var(--orange); }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--dim);
    text-decoration:none;
  }

  main{ max-width: 720px; margin:0 auto; padding: 18px 5vw 0; }

  /* ---------- LIST VIEW ---------- */
  .stop-card{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    box-shadow: 0 1px 2px rgba(20,19,17,0.03), 0 6px 18px rgba(20,19,17,0.05);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .stop-card:active{ transform: scale(0.98); }
  .stop-card.complete{ border-color: var(--teal-border); }
  .stop-info{ flex:1; min-width:0; }
  .stop-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing:0.01em;
    text-transform: capitalize;
    color: var(--ink);
  }
  .stop-order{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--dim);
    margin-top:2px;
  }
  .stop-progress-ring{
    width: 56px; height:56px;
    flex-shrink:0;
    position:relative;
  }
  .stop-progress-ring svg{ transform: rotate(-90deg); }
  .stop-progress-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    color: var(--ink);
  }
  .stop-badge-complete{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding: 4px 10px;
    border-radius:999px;
    background: var(--teal-tint-strong);
    color: var(--teal);
  }

  .stop-card.b2b{
    border-color: rgba(111,168,60,0.4);
    background: linear-gradient(135deg, rgba(111,168,60,0.06), var(--card) 60%);
  }
  .b2b-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding: 4px 10px;
    border-radius:999px;
    background: rgba(111,168,60,0.14);
    color: #4C7A24;
    margin-top:8px;
  }
  .b2b-tag::before{ content:"⬢"; font-size:10px; }

  .b2b-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background: linear-gradient(90deg, rgba(111,168,60,0.12), rgba(20,19,17,0.03));
    border: 1.5px solid rgba(111,168,60,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: #4C7A24;
  }
  .b2b-banner .icon{ font-size:18px; }

  .empty-state{
    text-align:center;
    padding: 60px 24px;
    color: var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    line-height:1.8;
  }

  .notif-banner{
    display:block;
    width:100%;
    background: var(--teal-tint-strong);
    border: 1.5px solid var(--teal-border);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 13.5px;
    padding: 14px 18px;
    border-radius: 14px;
    margin-bottom: 14px;
    cursor:pointer;
    text-align:left;
  }
  .notif-banner:active{ opacity:0.8; }

  /* ---------- ORDER DETAIL VIEW ---------- */
  .order-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom: 18px;
  }
  .order-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    text-transform:capitalize;
    color: var(--ink);
  }
  .order-sub{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--dim);
    margin-top:4px;
  }
  .order-total-progress{
    text-align:right;
    flex-shrink:0;
  }
  .order-total-count{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    color: var(--orange);
  }
  .order-total-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--dim);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .picker-badge-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom: 14px;
  }
  .picker-badge{
    display:flex;
    align-items:center;
    gap:9px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    box-shadow: 0 1px 2px rgba(20,19,17,0.04);
  }
  .picker-avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink:0;
  }
  .picker-avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--ink);
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 12px;
  }
  .picker-badge-text{ line-height:1.25; }
  .picker-badge-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color: var(--dim);
  }
  .picker-badge-name{
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink);
  }

  .scanner-ready-hint{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    color: var(--teal);
    margin-bottom: 14px;
  }
  .scanner-ready-hint .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal-glow);
  }

  .picker-row{
    margin-bottom: 18px;
  }
  .picker-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .picker-select{
    width:100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 15px;
    outline:none;
  }
  .picker-select:focus{ border-color: var(--orange); }

  .completed-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--teal-tint);
    border: 1.5px solid var(--teal-border);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--teal);
  }
  .reopen-link{
    margin-left:auto;
    text-decoration:underline;
    color: var(--dim);
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }

  .scan-btn{
    flex-shrink:0;
    width: 48px; height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--card-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 19px;
    cursor:pointer;
    color: var(--dim);
  }
  .scan-btn:active{ transform: scale(0.9); }

  .finish-btn{
    width:100%;
    padding: 18px;
    border-radius: 14px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 14px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    border: none;
    background: var(--orange);
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(232,97,44,0.3);
  }
  .finish-btn:disabled{
    opacity: 0.3;
    cursor: default;
    box-shadow:none;
  }
  .crate-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background: var(--card-2);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .crate-info{
    font-size: 13px;
    color: var(--ink);
  }
  .closed-crates-note{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--teal);
    margin: -6px 0 14px;
  }
  .crate-reprint-link{
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .crate-edit-link{
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    color: var(--orange);
    font-weight: 600;
    margin-left: 2px;
  }
  .crate-reprint-hint{
    opacity: 0.6;
  }

  .bt-status{
    position: fixed;
    left: 12px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 150;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 8px 12px;
    border-radius: 20px;
    background: #2a2a28;
    color: #999;
    border: 1px solid #3a3a37;
    cursor: pointer;
  }
  .bt-status.connected{
    background: var(--teal, #2BBFAA);
    color: #04231f;
    border-color: transparent;
  }
  #crateFab{
    position: fixed;
    right: 18px;
    bottom: calc(100px + env(safe-area-inset-bottom));
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: var(--ink);
    color: #fff;
    box-shadow: 0 8px 24px rgba(20,19,17,0.4);
    cursor: pointer;
    padding: 0;
  }
  #crateFab:active{ transform: scale(0.94); }
  #crateFab:disabled{
    opacity: 0.35;
    cursor: default;
  }
  #crateFab .fab-icon{
    font-size: 16px;
    line-height:1;
    margin-bottom: 1px;
  }
  #crateFab .fab-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.7;
    line-height:1;
    margin-bottom: 1px;
  }
  #crateFab .fab-count{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    line-height:1;
  }
  /* Small corner badge — how many items are packed into the crate shown
     on the button. Separated out from the big number on purpose: that
     used to be the ONLY number on this button (no label, no context),
     which made it easy to mistake for something else entirely, like a
     specific product's quantity, if it happened to land near an item
     row with a matching count. The big number is always the crate
     you're actively filling; this badge is just the item tally in it. */
  #crateFab .fab-badge{
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--orange);
    color: #fff;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }

  .finish-hint{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    margin: -4px 0 14px;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(20,19,17,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 200;
    padding: 24px;
  }
  .modal-box{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 380px;
    width:100%;
    box-shadow: 0 20px 60px rgba(20,19,17,0.25);
  }
  .print-modal-box{
    max-width: 420px;
  }
  .modal-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .modal-stat-row{
    display:flex;
    justify-content:space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    color: var(--ink);
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top: 20px;
  }
  .modal-btn{
    flex:1;
    padding: 14px;
    border-radius: 12px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 12.5px;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    border: 1.5px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
  }
  .modal-btn.confirm{
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
  }

  #scannerOverlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index: 300;
    display:flex;
    flex-direction:column;
  }
  #scannerOverlay .scanner-header{
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
  }
  #scannerOverlay .scanner-close{
    font-size: 22px;
    color:#fff;
    cursor:pointer;
    padding: 4px 10px;
  }
  #reader{ flex:1; }
  .scan-progress-label{
    padding: 16px 20px max(16px, env(safe-area-inset-bottom));
    color:#fff;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-align:center;
    background: rgba(0,0,0,0.5);
  }

  #wrongScanAlarm{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    text-align:center;
    color:#fff;
    background:#c91515;
    animation:wrong-scan-pulse .34s steps(2,end) infinite;
  }
  #wrongScanAlarm .alarm-icon{ font-size:78px; line-height:1; }
  #wrongScanAlarm h2{
    margin:18px 0 8px;
    font-family:'Bebas Neue', sans-serif;
    font-size:72px;
    line-height:.9;
    letter-spacing:2px;
  }
  #wrongScanAlarm p{
