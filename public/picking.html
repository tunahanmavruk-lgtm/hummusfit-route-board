<!-- Invisible input that captures real Bluetooth scanner "keyboard"
     input. A paired hardware scanner types the barcode into whatever
     text field is focused, then sends Enter — this field stays
     silently focused during picking so a scan works no matter what
     the picker is looking at on screen, no button tap required.
     IMPORTANT: this must stay INSIDE the visible viewport (top:0;
     left:0), not off-screen at a negative offset. renderOrder() calls
     focusHwScanInput() after every single item action, and re-focusing
     an element parked outside the viewport makes mobile browsers
     auto-scroll the page to reveal it — that was the "page jumps up
     every time I fulfill an item" bug (8/17/2026). Fixed-position at
     0,0 is always inside the viewport regardless of scroll, so no
     scroll-into-view is ever triggered, while opacity:0 and
     pointer-events:none keep it fully invisible and untappable. -->
<input type="text" id="hwScanInput" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
  style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none;">

<!-- Floating "New Crate" button — lives outside the scrolling item
     list entirely, always reachable regardless of order size, so a
     70-item order never needs scrolling to the bottom just to close
     out a crate. -->
<button id="crateFab" style="display:none;">
  <span class="fab-badge" id="crateFabItemCount">0</span>
  <span class="fab-icon">📦</span>
  <span class="fab-label">Crate</span>
  <span class="fab-count" id="crateFabCount">1</span>
</button>

<!-- The NETUM print companion sends ZPL automatically over Wi-Fi.
     Other devices retain Android's normal print dialog. -->
<div id="btPrinterStatus" class="bt-status connected">🖨️ Zebra 4×3 ready</div>

<script src="/crate-label-layout.js"></script>
<script src="/crate-label-zpl.js"></script>
<script>
(function(){
  function fmtTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', { timeZone:'America/New_York', hour:'numeric', minute:'2-digit' });
  }
  function escapeHtml(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  var view = 'list';
  var pickingList = [];
  var orderDetail = null;
  var scanningForIdx = null;
  var html5QrCode = null;
  var pushSubscribedFlag = false;

  function pushSupported(){
    return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
  }

  function urlBase64ToUint8Array(base64String){
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for(var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function subscribeToPush(){
    if(!pushSupported()) return Promise.resolve();
    return navigator.serviceWorker.register('/service-worker.js')
      .then(function(reg){ return reg.pushManager.getSubscription().then(function(existing){ return { reg: reg, existing: existing }; }); })
      .then(function(r){
        if(r.existing) { pushSubscribedFlag = true; return r.existing; }
        return fetch('/api/push-vapid-key').then(function(res){ return res.json(); }).then(function(data){
          return r.reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(data.publicKey)
          });
        });
      })
      .then(function(sub){
        if(!sub) return;
        pushSubscribedFlag = true;
        return fetch('/api/push-subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });
      })
      .catch(function(err){ console.error('Push subscribe failed:', err); });
  }

  function wireNotifBanner(){
    var btn = document.getElementById('enableNotifsBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      if(Notification.permission === 'denied'){
        alert('Notifications were previously blocked for this app. To turn them back on, check this device\'s notification settings for the Route Board home screen icon.');
        return;
      }
      Notification.requestPermission().then(function(permission){
        if(permission === 'granted'){
          subscribeToPush().then(function(){ renderList(); });
        } else {
          renderList();
        }
      });
    });
  }

  function ringSvg(picked, missing, total){
    var done = picked + missing;
    var pct = total > 0 ? done / total : 0;
    var r = 24, c = 2 * Math.PI * r;
    var offset = c * (1 - pct);
    var color = pct >= 1 ? 'var(--teal)' : 'var(--orange)';
    return '<svg width="56" height="56" viewBox="0 0 56 56">' +
      '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>' +
      '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round" ' +
        'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" style="transition: stroke-dashoffset .4s ease;"/>' +
      '</svg>';
  }

  function orderTimesLabel(stop){
    var orders = stop.orders || [];
    if(orders.length <= 1){
      var iso = orders.length === 1 ? orders[0].createdAt : null;
      return iso ? fmtTime(iso) : '';
    }
    // Multiple orders merged into this one picklist — show each order's
    // name + time so it's clear this stop placed more than one order today.
    return orders.map(function(o){
      return (o.name ? escapeHtml(o.name) + ' ' : '') + fmtTime(o.createdAt);
    }).join(' &nbsp;+&nbsp; ');
  }

  function renderList(){
    view = 'list';
    document.body.classList.remove('b2b-mode');
    document.getElementById('pageTitle').innerHTML = 'PICK <span>LIST</span>';
    document.getElementById('backLink').style.display = 'none';
    updateCrateFab();
    var main = document.getElementById('mainContent');

    var notifBanner = '';
    if(pushSupported() && Notification.permission !== 'granted'){
      notifBanner = '<button id="enableNotifsBtn" class="notif-banner">🔔 Get notified the moment a new order comes in — tap to turn on</button>';
    } else if(pushSupported() && Notification.permission === 'granted' && !pushSubscribedFlag){
      // Permission was granted (maybe in a previous session) but this
      // device isn't actually subscribed yet — finish silently rather
      // than asking again, since permission's already been given.
      subscribeToPush();
    }

    if(pickingList.length === 0){
      main.innerHTML = notifBanner + '<div class="empty-state">No orders in the current picking window yet.<br>Check back once today\'s orders start coming in.</div>';
      wireNotifBanner();
      return;
    }

    var html = notifBanner;
    pickingList.forEach(function(stop){
      var done = stop.pickedUnits !== undefined ? stop.pickedUnits + stop.missingUnits : stop.pickedCount + stop.missingCount;
      var total = stop.totalUnits !== undefined ? stop.totalUnits : stop.totalItems;
      var progressNoun = stop.totalUnits !== undefined ? 'units' : 'items';
      var cardClass = 'stop-card' + (stop.isComplete ? ' complete' : '') + (stop.isB2B ? ' b2b' : '');
      html +=
        '<div class="' + cardClass + '" data-stop="' + stop.stopName + '">' +
          '<div class="stop-info">' +
            '<div class="stop-name">' + stop.stopName + '</div>' +
            '<div class="stop-order">' + stop.orderName + ' — ' + done + '/' + total + ' ' + progressNoun + '</div>' +
            '<div class="stop-order-time" style="font-size:11px; color:var(--dim); margin-top:2px;">' + orderTimesLabel(stop) + '</div>' +
            (stop.isB2B ? '<div class="b2b-tag">Out of State</div>' : '') +
            (stop.isComplete ? '<div class="stop-badge-complete" style="margin-top:8px; display:inline-block;">' + (stop.retainedAfterFulfillment ? 'Ready for delivery' : 'Complete') + '</div>' : '') +
          '</div>' +
          '<div class="stop-progress-ring">' + ringSvg(stop.pickedUnits !== undefined ? stop.pickedUnits : stop.pickedCount, stop.missingUnits !== undefined ? stop.missingUnits : stop.missingCount, total) +
            '<div class="stop-progress-label">' + done + '/' + total + '</div>' +
          '</div>' +
        '</div>';
    });
    main.innerHTML = html;
    wireNotifBanner();

    document.querySelectorAll('.stop-card').forEach(function(card){
      card.addEventListener('click', function(){
        openOrder(card.dataset.stop);
      });
    });
  }

  function nextItemStatus(current){
    if(current === 'picked') return 'missing';
    if(current === 'missing') return 'not_picked';
    return 'picked';
  }

  // ---- Finish confirmation modal ----
  function closeModal(){
    document.getElementById('modalContainer').innerHTML = '';
  }

  function showFinishConfirmation(picked, missing, partial, total){
    var html =
      '<div class="modal-overlay" id="finishModalOverlay">' +
        '<div class="modal-box">' +
          '<div class="modal-title">Finish Order?</div>' +
          '<div class="modal-stat-row"><span>Picked</span><span>' + picked + '</span></div>' +
          '<div class="modal-stat-row"><span>Partial (short)</span><span>' + partial + '</span></div>' +
          '<div class="modal-stat-row"><span>Missing</span><span>' + missing + '</span></div>' +
          '<div class="modal-stat-row"><span>Total items</span><span>' + total + '</span></div>' +
          '<div class="modal-actions">' +
            '<div class="modal-btn" id="modalCancelBtn">Cancel</div>' +
            '<div class="modal-btn confirm" id="modalConfirmBtn">Confirm &amp; Finish</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalContainer').innerHTML = html;

    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('finishModalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'finishModalOverlay') closeModal();
    });
    document.getElementById('modalConfirmBtn').addEventListener('click', function(){
      fetch('/api/picking-finish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stopName: orderDetail.stopName })
      }).then(function(r){
        return r.json().then(function(data){ return { ok: r.ok, data: data }; });
      }).then(function(result){
        closeModal();
        if(!result.ok || result.data.error){
          alert(result.data.error || 'Could not finish this order.');
          return;
        }
        orderDetail.completedAt = result.data.completedAt;
        orderDetail.completedBy = result.data.completedBy;
        orderDetail.retainedAfterFulfillment = Boolean(result.data.retainedForDelivery);
        orderDetail.shopifyFulfilled = Boolean(result.data.retainedForDelivery);
        if(result.data.closedCrates){ orderDetail.closedCrates = result.data.closedCrates; }
        renderOrder();
        // Print the final crate's label too, so every crate has one by
        // the time the order is done — even if "New Crate" was never
        // tapped for this last box.
        if(result.data.finalCrateNumber){
          printCrateLabel(orderDetail.stopName, result.data.finalCrateNumber);
        }
        var fulfillmentFailures = (result.data.fulfillment || []).filter(function(entry){ return !entry.ok; });
        if(fulfillmentFailures.length){
          alert('Picking is saved, but Shopify has not confirmed fulfillment yet. This order will stay on the board for a manager to review.');
        }
      }).catch(function(err){
        closeModal();
        alert('Could not reach the server: ' + err.message);
      });
    });
  }

  // ---- Barcode scanning ----
  function requirePickerSelected(){
    if(orderDetail && orderDetail.pickedBy){ return true; }
    alert("Select who's picking this order first — tap the name dropdown at the top of the screen.");
    var pickerEl = document.getElementById('pickerSelect');
    if(pickerEl){ pickerEl.focus(); }
    return false;
  }

  function openScanner(idx){
    if(!requirePickerSelected()) return;
    scanningForIdx = idx;
    lastScanTime = 0;
    lastScanCode = null;
    document.getElementById('scannerOverlay').style.display = 'flex';
    var item = orderDetail.lineItems[idx];
    var scannedSoFar = (orderDetail.itemScannedCount && orderDetail.itemScannedCount[idx]) || 0;
    var progressEl = document.getElementById('scanProgressLabel');
    if(progressEl){
      progressEl.textContent = scannedSoFar > 0
        ? ('Scanned ' + scannedSoFar + ' of ' + item.quantity + ' — keep scanning')
        : ('Scan ' + item.title + ' — ' + item.quantity + ' needed');
    }
    if(typeof Html5Qrcode === 'undefined'){
      alert('Barcode scanner failed to load. Check your connection and try again.');
      closeScanner();
      return;
    }
    html5QrCode = new Html5Qrcode("reader", {
      // Explicit, not relying on the library's default — products are
      // scanned via their real retail barcode (UPC/EAN), not a QR code,
      // so every common 1D format needs to actually be turned on.
      formatsToSupport: [
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    });
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 280, height: 140 } },
      function(decodedText){
        handleScanResult(decodedText);
      },
      function(){ /* ignore per-frame scan misses */ }
    ).catch(function(err){
      alert('Could not access the camera: ' + err);
      closeScanner();
    });
  }

  function closeScanner(){
    document.getElementById('scannerOverlay').style.display = 'none';
    if(html5QrCode){
      html5QrCode.stop().catch(function(){}).then(function(){
        html5QrCode.clear();
        html5QrCode = null;
      });
    }
    scanningForIdx = null;
  }

  // Fires on every successful scan match — hardware scanner or camera —
  // so the picker gets an immediate physical + audible "got it" without
  // having to look at the screen. Synthesized register-bell chime (two
  // quick bright tones) rather than a hosted audio file, so there's
  // nothing to fail to load on a bad warehouse wifi connection.
  var scanAudioCtx = null;
  function scanAudioContext(){
    if(!scanAudioCtx){ scanAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(scanAudioCtx.state === 'suspended'){ scanAudioCtx.resume().catch(function(){}); }
    return scanAudioCtx;
  }
  function playScanFeedback(){
    if(navigator.vibrate){ navigator.vibrate(60); }
    try{
      var ctx = scanAudioContext();
      var now = ctx.currentTime;
      [[1568, now, 0.09], [1976, now + 0.07, 0.16]].forEach(function(t){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = t[0];
        gain.gain.setValueAtTime(0.0001, t[1]);
        gain.gain.exponentialRampToValueAtTime(0.3, t[1] + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t[1] + t[2]);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t[1]);
        osc.stop(t[1] + t[2] + 0.02);
      });
    } catch(e){ /* audio unavailable — never block scanning over this */ }
  }

  // A wrong product needs to stop the picker before it reaches the crate.
  // Use a full-screen flashing red interruption, a repeating harsh two-tone
  // alarm, and a long vibration pattern. Everything is generated locally so
  // it still works if warehouse internet is slow or briefly unavailable.
  function playWrongScanAlarm(){
    if(navigator.vibrate){ navigator.vibrate([240,90,240,90,480,120,480]); }
    try{
      var ctx = scanAudioContext();
      var now = ctx.currentTime;
      for(var i = 0; i < 8; i++){
        var start = now + i * 0.19;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = i % 2 ? 520 : 1040;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.7, start + 0.01);
        gain.gain.setValueAtTime(0.7, start + 0.13);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.19);
      }
    }catch(e){ /* the red screen and vibration still provide the warning */ }
  }

  function showWrongScanAlarm(scannedCode, message){
    document.getElementById('wrongScanMessage').textContent = message || 'This barcode is not needed for the current order.';
    document.getElementById('wrongScanCode').textContent = scannedCode ? ('SCANNED: ' + scannedCode) : '';
    document.getElementById('wrongScanAlarm').style.display = 'flex';
    playWrongScanAlarm();
    document.getElementById('wrongScanDismiss').focus();
  }

  function dismissWrongScanAlarm(){
    document.getElementById('wrongScanAlarm').style.display = 'none';
    if(navigator.vibrate){ navigator.vibrate(0); }
    setTimeout(focusHwScanInput, 50);
  }

  document.getElementById('wrongScanDismiss').addEventListener('click', dismissWrongScanAlarm);

  var scanSuccessTimer = null;
  function showScanSuccess(title, scannedCount, totalQty){
    var toast = document.getElementById('scanSuccessToast');
    document.getElementById('scanSuccessTitle').textContent = '✓ ' + title;
    document.getElementById('scanSuccessCount').textContent = scannedCount + ' / ' + totalQty + ' SCANNED';
    toast.style.display = 'block';
    if(scanSuccessTimer){ clearTimeout(scanSuccessTimer); }
    scanSuccessTimer = setTimeout(function(){ toast.style.display = 'none'; }, 2200);
  }

  function clientBarcodeVariants(value){
    var code = String(value || '').trim();
    var variants = new Set([code]);
    if(/^\d{11}$/.test(code)){
      var sum = 0;
      for(var i = 0; i < code.length; i++) sum += Number(code[i]) * (i % 2 === 0 ? 3 : 1);
      variants.add(code + String((10 - (sum % 10)) % 10));
    }
    if(/^0\d+$/.test(code)) variants.add(code.replace(/^0/, ''));
    if(/^\d+$/.test(code)) variants.add('0' + code);
    return variants;
  }

  function itemMatchesScan(item, scannedCode){
    var expected = String(item.scanCode || item.sku || '').trim();
    if(!expected) return false;
    return clientBarcodeVariants(scannedCode).has(expected) || clientBarcodeVariants(expected).has(String(scannedCode || '').trim());
  }

  var lastScanTime = 0;
  var lastScanCode = null;
  function handleScanResult(scannedCode){
    if(scanningForIdx === null) return;
    var idx = scanningForIdx;
    var item = orderDetail.lineItems[idx];
    var expectedSku = (item.scanCode || item.sku || '').trim();
    var scanned = (scannedCode || '').trim();

    if(!expectedSku){
      closeScanner();
      alert('No barcode on file for this item yet — mark it picked manually.');
      return;
    }

    // The camera fires this callback up to 10x/second — without a
    // cooldown, holding ONE physical item in view for even half a
    // second would register as several scans instead of one, silently
    // over-counting toward the total needed. 1.5s is enough time for a
    // picker to set one unit aside and bring the next one into frame.
    var now = Date.now();
    if(scanned === lastScanCode && (now - lastScanTime) < 1500) return;

    if(!itemMatchesScan(item, scanned)){
      // Wrong item — this is worth interrupting for, so close and alert
      // rather than silently ignoring a real mismatch.
      closeScanner();
      showWrongScanAlarm(scanned, 'Expected "' + item.title + '". Put this product back and scan the correct item.');
      return;
    }

    lastScanTime = now;
    lastScanCode = scanned;

    // Route through the same server-authoritative counting logic as the
    // hardware scanner — one scan = one physical unit, not the whole
    // line item, so a 30-unit order genuinely needs 30 scans.
    fetch('/api/picking-scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stopName: orderDetail.stopName, scannedCode: scanned })
    }).then(function(r){ return r.json(); }).then(function(result){
      if(!result.matched){
        closeScanner();
        alert(result.needsPicker ? "Select who's picking this order first." : (result.alreadyResolved ? 'That item is already fully accounted for.' : 'Could not match that scan — try again.'));
        return;
      }
      playScanFeedback();
      orderDetail.itemStatus = result.itemStatus;
      orderDetail.itemScannedCount = result.itemScannedCount;
      orderDetail.itemCrateNumber = result.itemCrateNumber;
      orderDetail.itemCrateBreakdown = result.itemCrateBreakdown;
      orderDetail.currentCrateNumber = result.currentCrateNumber;
      showScanSuccess(result.itemTitle || item.title, result.scannedCount || result.itemScannedCount[idx], result.totalQty || item.quantity);
      var nowFullyPicked = result.itemStatus[idx] === 'picked';
      if(nowFullyPicked){
        // Fully accounted for — nothing left to scan for this item, so
        // now it makes sense to close and return to the order.
        closeScanner();
        renderOrder();
      } else {
        // Still more to go — keep the camera running and just update
        // the live count on screen, so the picker can immediately bring
        // the next physical unit into view without reopening anything.
        var progressEl = document.getElementById('scanProgressLabel');
        if(progressEl){
          progressEl.textContent = 'Scanned ' + result.itemScannedCount[idx] + ' of ' + item.quantity + ' — keep scanning';
        }
        // The crate button sits behind this full-screen scanner overlay,
        // but it needs to already reflect the units just scanned by the
        // time the picker closes the scanner — otherwise it shows a
        // stale pre-scan count until some unrelated re-render happens to
        // fire. Cheap to just refresh it here on every unit scanned.
        updateCrateFab();
      }
    }).catch(function(err){
      closeScanner();
      alert('Could not reach the server: ' + err.message);
    });
  }

  document.getElementById('scannerCloseBtn').addEventListener('click', closeScanner);

  // ---- Floating "New Crate" button ----
  // Wired once, lives outside the re-rendered content, so it stays
  // reachable and functional no matter how far down a long order the
  // picker has scrolled.
  var crateFabEl = document.getElementById('crateFab');
  var crateFabCountEl = document.getElementById('crateFabCount');
  var crateFabItemCountEl = document.getElementById('crateFabItemCount');

  function updateCrateFab(){
    if(view !== 'order' || !orderDetail || orderDetail.completedAt){
      crateFabEl.style.display = 'none';
      return;
    }
    // Real unit count, not a line-item count, and split-aware: a
    // large-quantity item can legitimately have some units already
    // packed in an earlier crate and the rest going into this one, if
    // "New Crate" got tapped mid-scan. itemCrateBreakdown tracks exactly
    // how many units of each item are in EACH crate, so this reads the
    // real count for the crate that's active right now instead of
    // assuming an item belongs entirely to one crate — that assumption
    // was the bug: continuing to scan the same (or another) item after
    // switching crates kept crediting the crate that item was FIRST
    // scanned into, so the new crate's badge stayed stuck at 0.
    var unitsInCurrentCrate = 0;
    orderDetail.lineItems.forEach(function(item, idx){
      var breakdown = orderDetail.itemCrateBreakdown && orderDetail.itemCrateBreakdown[idx];
      if(breakdown && breakdown[orderDetail.currentCrateNumber]){
        unitsInCurrentCrate += breakdown[orderDetail.currentCrateNumber];
        return;
      }
      // Manual tap-to-pick items never get split across crates (one
      // instant action, one crate) — itemCrateNumber still covers those.
      if(!orderDetail.itemCrateNumber || orderDetail.itemCrateNumber[idx] !== orderDetail.currentCrateNumber) return;
      var status = orderDetail.itemStatus ? orderDetail.itemStatus[idx] : undefined;
      if(status === 'partial' && orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined){
        unitsInCurrentCrate += orderDetail.itemPickedQty[idx];
      } else if(status === 'picked'){
        unitsInCurrentCrate += item.quantity;
      }
    });
    crateFabEl.style.display = 'flex';
    crateFabEl.disabled = unitsInCurrentCrate === 0;
    // Big number: which crate you're actively packing into right now —
    // stays meaningful however far you've scrolled. Small corner badge:
    // total units physically in it so far.
    crateFabCountEl.textContent = orderDetail.currentCrateNumber;
    crateFabItemCountEl.textContent = unitsInCurrentCrate;
  }

  crateFabEl.addEventListener('click', function(){
    if(!orderDetail) return;
    crateFabEl.disabled = true;
    fetch('/api/picking-new-crate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stopName: orderDetail.stopName })
    }).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(result){
      if(!result.ok || result.data.error){
        alert(result.data.error || 'Could not close this crate.');
        updateCrateFab();
        return;
      }
      orderDetail.closedCrates = orderDetail.closedCrates || [];
      orderDetail.closedCrates.push(result.data.closedCrateNumber);
      orderDetail.currentCrateNumber = result.data.currentCrateNumber;
      renderOrder();
      // Print the just-closed crate's label directly, right on this
      // screen — no tab switch, tap Print and keep picking.
      printCrateLabel(orderDetail.stopName, result.data.closedCrateNumber);
    }).catch(function(err){
      alert('Could not reach the server: ' + err.message);
      updateCrateFab();
    });
  });

  // ---- Real Bluetooth (hardware) scanner support ----
  // A paired Bluetooth scanner acts like a keyboard: it types the
  // barcode into this invisible field, then sends Enter automatically.
  // Unlike the camera flow, no item needs to be pre-selected — the
  // picker just scans whatever product is in their hand, and the
  // system finds which line item it matches.
  var hwScanInputEl = document.getElementById('hwScanInput');
  var lastHandledScanCode = '';
  var lastHandledScanAt = 0;
  var nativeScanCursor = null;
  var nativeScannerAvailable = false;

  // Zebra desktop printers are connected through the operating-system or
  // Android Zebra Print service. This status control opens setup guidance.
  function btStatusEl(){ return document.getElementById('btPrinterStatus'); }

  async function bridgeRequest(path, options, timeoutMs){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, timeoutMs);
    try{
      return await fetch('http://127.0.0.1:8877' + path, Object.assign({}, options || {}, { signal:controller.signal, cache:'no-store' }));
    }finally{
      clearTimeout(timer);
    }
  }

  async function autoPrintAvailable(){
    if(typeof createCrateLabelZpl !== 'function') return false;
    try{
      var response = await bridgeRequest('/status', {}, 1500);
      if(response.ok){
        btStatusEl().textContent = '🖨️ Auto Print ready';
        return true;
      }
    }catch(e){}
    return false;
  }

  // On a NETUM with HF Auto Print, the crate goes straight to the Zebra
  // without an Android dialog. Devices without the companion retain the
  // tested 4x3 system-print path so no saved crate loses its label.
  async function printCrateLabel(stopName, crateNumber){
    try{
      var response = await fetch('/api/crate-label-data/' + encodeURIComponent(stopName) + '/' + encodeURIComponent(crateNumber), { cache:'no-store' });
      var data = await response.json();
      if(!response.ok || data.error) throw new Error(data.error || 'Could not load crate label.');
      if(await autoPrintAvailable()){
        var labelPages = createCrateLabelZpl.pages(data, crateNumber);
        var jobId = String(stopName) + '/' + crateNumber + '/' + Date.now() + '/' + Math.random().toString(36).slice(2);
        for(var pageIndex = 0; pageIndex < labelPages.length; pageIndex++){
          var sent;
          try{
            sent = await bridgeRequest('/print', {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'X-HF-Print':'1' },
              body:JSON.stringify({ jobId:jobId + '/' + (pageIndex + 1), zpl:labelPages[pageIndex] })
            }, 8000);
          }catch(bridgeError){
            throw new Error('NETUM did not confirm label ' + (pageIndex + 1) + '/' + labelPages.length + '. Check its notification and use Reprint if needed.');
          }
          var result = await sent.json();
          if(!sent.ok || !result.ok) throw new Error('Label ' + (pageIndex + 1) + '/' + labelPages.length + ': ' + (result.message || 'Zebra did not accept it.'));
        }
        btStatusEl().textContent = '🖨️ Crate ' + crateNumber + ': ' + labelPages.length + ' label' + (labelPages.length === 1 ? '' : 's') + ' sent to Zebra';
        setTimeout(function(){ btStatusEl().textContent = '🖨️ Auto Print ready'; }, 4000);
        return;
      }
      renderCratePrintSheet(data, crateNumber);
      window.print();
    }catch(err){
      alert('Crate was saved, but its label was not confirmed: ' + err.message + '\nUse Reprint on this crate to try again.');
    }
  }

  function renderCratePrintSheet(data, crateNumber){
    var sheet = document.getElementById('cratePrintSheet');
    if(!sheet){
      sheet = document.createElement('div');
      sheet.id = 'cratePrintSheet';
      document.body.appendChild(sheet);
    }
    var pages = buildCrateLabelPages(data);
    var stop = String(data.stopNameUpper || '').toUpperCase();
    var code = String(data.identity && data.identity.monogram || stop.replace(/[^A-Z]/g, '').slice(0, 3));
    var patternName = String(data.identity && data.identity.pattern || 'diagonal');
    function inch(dot){ return (dot / 203).toFixed(3) + 'in'; }
    sheet.innerHTML = pages.map(function(page){
      var stopSize = stop.length > 24 ? 19 : stop.length > 15 ? 23 : stop.length > 10 ? 28 : 39;
      return '<div class="crate-label-page">' +
        '<div class="crate-label-frame"></div>' +
        '<div class="crate-label-bar"><span>' + escapeHtml((data.routeName || 'HUMMUS FIT').toUpperCase()) + '</span><span>' + escapeHtml(code) + '</span></div>' +
        '<div class="crate-label-pattern ' + escapeHtml(patternName) + '"></div>' +
        '<div class="crate-label-store" style="font-size:' + inch(stopSize * 2.1) + '">' + escapeHtml(stop) + '</div>' +
        '<div class="crate-label-crate"><small>CRATE</small><strong>' + escapeHtml(crateNumber) + '</strong></div>' +
        '<div class="crate-label-meta"><span>ORDER ' + escapeHtml(data.orderName || '') + '</span><span>' + (data.pickedBy ? 'PICKED BY ' + escapeHtml(String(data.pickedBy).split(',')[0].trim().split(/\s+/)[0].toUpperCase()) : '') + '</span></div>' +
        '<div class="crate-label-contents"><span>CONTENTS</span><span>' + (page.total > 1 ? 'LABEL ' + page.number + '/' + page.total : '') + '</span></div>' +
        page.entries.map(function(entry){
          var x = entry.column ? 416 : 30;
          var width = page.columns === 2 ? 356 : 749;
          return '<div class="crate-label-item" style="left:' + inch(x) + ';top:' + inch(entry.y) + ';width:' + inch(width) + ';height:' + inch(entry.height) + ';font-size:' + inch(page.font) + '">' +
            '<b>' + escapeHtml(entry.quantity) + '</b><span>' + entry.lines.map(escapeHtml).join('<br>') + '</span></div>';
        }).join('') +
      '</div>';
    }).join('');
  }

  function focusHwScanInput(){
    if(view === 'order' && orderDetail && !orderDetail.completedAt){
      // preventScroll is a second line of defense on top of the fixed
      // top:0/left:0 positioning above — belt-and-suspenders against
      // any browser that still tries to scroll a freshly-focused
      // element into view.
      try{
        hwScanInputEl.focus({ preventScroll: true });
      } catch(e){
        hwScanInputEl.focus();
      }
    }
  }

  hwScanInputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      // Enter from the physical scanner is a user gesture, so wake the
      // AudioContext now. This guarantees the later wrong-item alarm is not
      // suppressed by Android/Chrome autoplay rules after a network roundtrip.
      try{ scanAudioContext(); }catch(audioError){}
      var code = hwScanInputEl.value.trim();
      hwScanInputEl.value = '';
      // Q900 production scans arrive through Android's scanner keyboard.
      // Some firmware also emits the companion broadcast, so both paths
      // feed the same short-window de-duplicator below.
      if(code){ handleIncomingHardwareScan(code); }
    }
  });

  // NETUM's keyboard-emulation path can occasionally beep without delivering
  // the barcode to Chrome. HF Auto Print also receives the scanner's native
  // broadcast and exposes it over the device-only bridge, so every decoded
  // scan reaches this page even when Android drops the synthetic keypresses.
  function handleIncomingHardwareScan(scannedCode){
    var code = String(scannedCode || '').replace(/[\r\n]/g, '').trim();
    if(!code) return;
    var now = Date.now();
    if(code === lastHandledScanCode && now - lastHandledScanAt < 400) return;
    lastHandledScanCode = code;
    lastHandledScanAt = now;
    try{ scanAudioContext(); }catch(audioError){}
    handleHardwareScan(code);
  }

  async function pollNativeScanner(){
    try{
      var path = nativeScanCursor === null ? '/scan' : '/scan?after=' + encodeURIComponent(nativeScanCursor);
      var response = await bridgeRequest(path, {}, 1200);
      if(response.ok){
        nativeScannerAvailable = true;
        var result = await response.json();
        if(nativeScanCursor === null) nativeScanCursor = Number(result.latestId || 0);
        if(result.scan && Number(result.scan.id) > nativeScanCursor){
          nativeScanCursor = Number(result.scan.id);
          handleIncomingHardwareScan(result.scan.code);
          // Drain another queued scan immediately; the normal timer resumes
          // once the bridge has no newer event.
          setTimeout(pollNativeScanner, 0);
          return;
        }
      }
    }catch(e){}
    setTimeout(pollNativeScanner, 250);
  }
  pollNativeScanner();

  // iOS Safari can drop focus after alerts, taps elsewhere, or the app
  // being backgrounded — keep pulling it back so a physical scan works
  // at any moment without the picker having to tap anything first.
  // IMPORTANT: never do this if the tap was on a real interactive
  // control (the picker dropdown, buttons, text inputs) — forcibly
  // stealing focus mid-tap is exactly what broke the "Who's picking"
  // dropdown on iPad/iPhone, since it fought with the native picker
  // wheel trying to open.
  var INTERACTIVE_TAGS = ['SELECT', 'INPUT', 'TEXTAREA', 'BUTTON', 'A'];
  document.addEventListener('click', function(e){
    var el = e.target;
    while(el && el !== document.body){
      if(el.id === 'hwScanInput') return;
      if(INTERACTIVE_TAGS.indexOf(el.tagName) !== -1) return;
      el = el.parentElement;
    }
    setTimeout(focusHwScanInput, 50);
  });
  window.addEventListener('focus', function(){ setTimeout(focusHwScanInput, 50); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(focusHwScanInput, 50);
  });

  function handleHardwareScan(scannedCode){
    if(!orderDetail) return;
    if(!requirePickerSelected()) return;
    var matchesAnyOrderItem = orderDetail.lineItems.some(function(item){
      return itemMatchesScan(item, scannedCode);
    });
    if(!matchesAnyOrderItem){
      showWrongScanAlarm(scannedCode, 'This product is not needed for ' + orderDetail.stopName + '. Put it back before continuing.');
      return;
    }
    fetch('/api/picking-scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stopName: orderDetail.stopName, scannedCode: scannedCode })
    }).then(function(r){ return r.json(); }).then(function(result){
      if(!result.matched){
        if(result.needsPicker){
          alert("Select who's picking this order first.");
        } else if(result.alreadyResolved){
          alert('That item is already fully accounted for.');
        } else {
          showWrongScanAlarm(scannedCode, 'This product is not needed for the current order. Put it back before continuing.');
        }
        focusHwScanInput();
        return;
      }
      playScanFeedback();
      orderDetail.itemStatus = result.itemStatus;
      orderDetail.itemScannedCount = result.itemScannedCount;
      orderDetail.itemCrateNumber = result.itemCrateNumber;
      orderDetail.itemCrateBreakdown = result.itemCrateBreakdown;
      orderDetail.currentCrateNumber = result.currentCrateNumber;
      renderOrder();
      showScanSuccess(result.itemTitle, result.scannedCount, result.totalQty);
    }).catch(function(err){
      alert('Could not reach the server: ' + err.message);
      focusHwScanInput();
    });
  }

  function renderOrder(){
    view = 'order';
    document.getElementById('pageTitle').textContent = orderDetail.stopName;
    document.getElementById('backLink').style.display = 'inline-flex';
    var main = document.getElementById('mainContent');

    document.body.classList.toggle('b2b-mode', Boolean(orderDetail.isB2B));

    var picked = 0, missing = 0, partial = 0, notPicked = 0;
    orderDetail.lineItems.forEach(function(item, idx){
      var s = orderDetail.itemStatus[idx] || 'not_picked';
      if(s === 'picked') picked++;
      else if(s === 'missing') missing++;
      else if(s === 'partial') partial++;
      else notPicked++;
    });
    var rowTotal = orderDetail.lineItems.length;
    var total = orderDetail.lineItems.reduce(function(sum, item){ return sum + (Number(item.quantity) || 0); }, 0);
    var done = 0;
    orderDetail.lineItems.forEach(function(item, idx){
      var quantity = Number(item.quantity) || 0;
      var status = orderDetail.itemStatus[idx] || 'not_picked';
      if(status === 'picked' || status === 'missing' || status === 'partial'){
        done += quantity;
      } else {
        done += Math.min(quantity, Number(orderDetail.itemScannedCount && orderDetail.itemScannedCount[idx]) || 0);
      }
    });
    var isLocked = Boolean(orderDetail.completedAt);
    var isFulfilledSnapshot = Boolean(orderDetail.retainedAfterFulfillment);

    var html = '';
    if(orderDetail.isB2B){
      html += '<div class="b2b-banner"><span class="icon">⬢</span> Out-of-State / B2B Order — different from local store picking</div>';
    }

    if(isLocked){
      html +=
        '<div class="completed-banner">' +
          '✓ Finished by ' + orderDetail.completedBy + ' — ' + fmtTime(orderDetail.completedAt) +
          (isFulfilledSnapshot
            ? '<span>' + (orderDetail.shopifyFulfilled ? 'Shopify fulfilled' : 'Completed') + ' · kept visible for delivery &amp; receiving</span>'
            : '<span class="reopen-link" id="reopenLink">Reopen</span>') +
        '</div>';
    }

    html +=
      '<div class="order-header">' +
        '<div>' +
          '<div class="order-title">' + orderDetail.orderName + '</div>' +
          '<div class="order-sub">' + orderDetail.stopName + '</div>' +
          '<div class="order-sub" style="font-size:11px; opacity:0.7; margin-top:2px;">' + orderTimesLabel(orderDetail) + '</div>' +
        '</div>' +
        '<div class="order-total-progress">' +
          '<div class="order-total-count">' + done + '/' + total + '</div>' +
          '<div class="order-total-label">Units verified</div>' +
        '</div>' +
      '</div>';

    // A scoped, single-order reset — only wipes THIS stop's picking
    // progress (status, scan counts, crates, who's picking). Everything
    // else (every other stop, van/driver assignments, the rest of the
    // day's board) stays untouched. This exists specifically so a bad
    // scan session doesn't force "Reset Today's Board," which wipes
    // literally everything for every stop and every driver.
    if(!isFulfilledSnapshot){
      html +=
        '<div style="text-align:right; margin:-8px 0 14px;">' +
          '<span class="reopen-link" id="restartOrderLink" style="cursor:pointer; text-decoration:underline; color:var(--dim); font-size:11px;">&#8635; Restart this order</span>' +
        '</div>';
    }

    if(orderDetail.pickedBy){
      var initials = orderDetail.pickedBy.split(/[\s,]+/).filter(Boolean).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
      var avatarHtml = orderDetail.pickedByPhoto
        ? '<img class="picker-avatar" src="' + orderDetail.pickedByPhoto + '" alt="">'
        : '<div class="picker-avatar picker-avatar-fallback">' + initials + '</div>';
      html +=
        '<div class="picker-badge-row">' +
          '<div class="picker-badge">' +
            avatarHtml +
            '<div class="picker-badge-text">' +
              '<div class="picker-badge-label">' + (isLocked ? 'Picked by' : 'Currently picking') + '</div>' +
              '<div class="picker-badge-name">' + orderDetail.pickedBy + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    if(!isLocked){
      html += '<div class="scanner-ready-hint"><span class="dot"></span>Bluetooth scanner ready — scan any item, no tap needed</div>';
      html +=
        '<div class="picker-row">' +
          '<div class="picker-label">Who\'s picking this order</div>' +
          '<select class="picker-select" id="pickerSelect">' +
            '<option value="">— Select your name —</option>' +
            (orderDetail.pickers || []).map(function(p){
              return '<option value="' + p + '"' + (p === orderDetail.pickedBy ? ' selected' : '') + '>' + p + '</option>';
            }).join('') +
          '</select>' +
        '</div>';
    }

    orderDetail.lineItems.forEach(function(item, idx){
      var status = orderDetail.itemStatus[idx] || 'not_picked';
      var pickedQty = (orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined) ? orderDetail.itemPickedQty[idx] : null;
      var scannedSoFar = (orderDetail.itemScannedCount && orderDetail.itemScannedCount[idx] !== undefined) ? orderDetail.itemScannedCount[idx] : 0;
      var icon = status === 'picked' ? '✓' : (status === 'missing' ? '✕' : (status === 'partial' ? '½' : ''));
      var label;
      if(status === 'picked'){ label = 'Picked'; }
      else if(status === 'missing'){ label = 'Missing'; }
      else if(status === 'partial'){ label = 'Short — ' + pickedQty + ' of ' + item.quantity + ' picked'; }
      else if(scannedSoFar > 0){ label = 'Scanned ' + scannedSoFar + ' of ' + item.quantity + ' — keep scanning'; }
      else { label = 'Tap when picked'; }
      var isScanInProgress = status === 'not_picked' && scannedSoFar > 0;
      var qtyDisplay = (status === 'partial' && pickedQty !== null) ? (pickedQty + '/' + item.quantity)
        : (isScanInProgress ? (scannedSoFar + '/' + item.quantity) : item.quantity);
      html +=
        '<div class="item-card ' + status + (isScanInProgress ? ' scan-progress' : '') + '" data-idx="' + idx + '" style="' + (isLocked ? 'opacity:0.7;' : '') + '">' +
          '<div class="item-qty">' + qtyDisplay + '</div>' +
          (item.imageUrl
            ? '<img class="item-thumb" src="' + item.imageUrl + '" alt="" loading="lazy">'
            : '<div class="item-thumb-placeholder">—</div>') +
          '<div class="item-info">' +
            '<div class="item-title">' + item.title + '</div>' +
            '<div class="item-status-label">' + label + '</div>' +
            (isLocked ? '' : '<div class="partial-link" data-partial-idx="' + idx + '">Only had some? Enter partial quantity</div>') +
          '</div>' +
          (isLocked ? '' : '<div class="scan-btn" data-scan-idx="' + idx + '" title="Scan barcode">▤</div>') +
          '<div class="tap-btn" data-idx="' + idx + '">' + icon + '</div>' +
        '</div>';
      if(status === 'missing' || status === 'partial'){
        html +=
          '<div class="missing-note-row">' +
            '<input type="text" placeholder="Why is it short? (optional)" data-note-idx="' + idx + '" value="' +
            (orderDetail.itemNotes[idx] || '').replace(/"/g,'&quot;') + '" ' + (isLocked ? 'disabled' : '') + '>' +
          '</div>';
      }
    });

    var hasMissing = (missing + partial) > 0;
    var canFinish = !isLocked && notPicked === 0 && rowTotal > 0;

    if(!isLocked){
      var itemsInCurrentCrate = orderDetail.lineItems.filter(function(item, idx){
        return orderDetail.itemCrateNumber && orderDetail.itemCrateNumber[idx] === orderDetail.currentCrateNumber;
      }).length;
      html +=
        '<div class="crate-row">' +
          '<div class="crate-info">Currently packing: <strong>Crate ' + orderDetail.currentCrateNumber + '</strong> (' + itemsInCurrentCrate + ' item' + (itemsInCurrentCrate === 1 ? '' : 's') + ') — use the floating button, bottom right, to close it out from anywhere on the page</div>' +
        '</div>';
      if((orderDetail.closedCrates || []).length > 0){
        html += '<div class="closed-crates-note">Closed: ' +
          orderDetail.closedCrates.slice().sort(function(a, b){ return a - b; }).map(function(c){
            return '<span class="crate-reprint-link" data-crate="' + c + '">Crate ' + c + '</span>' +
              ' <span class="crate-edit-link" data-edit-crate="' + c + '">Edit</span>';
          }).join(', ') +
          ' <span class="crate-reprint-hint">(tap the crate number to reprint its label, tap Edit to add/remove items in it)</span></div>';
      }

      html += '<button class="finish-btn" id="finishBtn"' + (canFinish ? '' : ' disabled') + '>Finish Order</button>';
      if(!canFinish){
        html += '<div class="finish-hint">' +
          (notPicked > 0 ? notPicked + ' item(s) still need to be marked before you can finish' : 'Select your name to finish') +
        '</div>';
      }
    }

    html +=
      '<div class="bottom-bar">' +
        '<a class="big-btn' + (hasMissing ? ' danger' : ' disabled') + '" ' +
          (hasMissing ? 'href="/api/missing-items-pdf/' + encodeURIComponent(orderDetail.stopName) + '" target="_blank"' : '') +
          '>Missing Report</a>' +
        '<a class="big-btn primary" href="/api/packing-slip/' + encodeURIComponent(orderDetail.stopName) + '" target="_blank">Packing Slip PDF</a>' +
      '</div>';

    main.innerHTML = html;

    if(isLocked){
      var reopenEl = document.getElementById('reopenLink');
      if(reopenEl){
        reopenEl.addEventListener('click', function(){
          if(confirm('Reopen this order for editing?')){
            fetch('/api/picking-reopen', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ stopName: orderDetail.stopName })
            }).then(function(r){ return r.json(); }).then(function(){
              orderDetail.completedAt = null;
              orderDetail.completedBy = null;
              renderOrder();
            });
          }
        });
      }
    }

    var restartEl = document.getElementById('restartOrderLink');
    if(restartEl){
      restartEl.addEventListener('click', function(){
        var warning = 'Restart picking for ' + orderDetail.stopName + '?\n\n' +
          'This clears every item\'s status, all scan progress, and all crates for THIS order only — everything else on the board (every other stop, van/driver assignments) is untouched.\n\n' +
          'This cannot be undone.';
        if(!confirm(warning)) return;
        fetch('/api/picking-reset-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName })
        }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
          .then(function(result){
            if(!result.ok || result.data.error){
              alert(result.data.error || 'Could not restart this order.');
              return;
            }
            openOrder(orderDetail.stopName);
          })
          .catch(function(err){
            alert('Could not reach the server: ' + err.message);
          });
      });
    }

    var pickerEl = document.getElementById('pickerSelect');
    if(pickerEl){
      pickerEl.addEventListener('change', function(){
        orderDetail.pickedBy = pickerEl.value;
        fetch('/api/picking-set-picker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName, picker: pickerEl.value })
        }).then(function(r){ return r.json(); }).then(function(data){
          orderDetail.pickedByPhoto = data.pickedByPhoto || null;
          renderOrder();
        });
      });
    }

    var finishEl = document.getElementById('finishBtn');
    if(finishEl){
      finishEl.addEventListener('click', function(){
        showFinishConfirmation(picked, missing, partial, rowTotal);
      });
    }

    // Reprints use the same print path as newly closed crates.
    document.querySelectorAll('.crate-reprint-link').forEach(function(el){
      el.addEventListener('click', function(){
        printCrateLabel(orderDetail.stopName, el.dataset.crate);
      });
    });

    // Reopen a closed crate so its items can be edited — adds/removes/
    // quantity changes on any item then land in THIS crate, because
    // every pick/scan action already writes to whichever crate number
    // the server considers "current." Closing it again (New Crate)
    // reprints its label with whatever changed.
    document.querySelectorAll('.crate-edit-link').forEach(function(el){
      el.addEventListener('click', function(){
        var crateNumber = el.dataset.editCrate;
        el.textContent = 'Reopening…';
        fetch('/api/picking-reopen-crate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName, crateNumber: crateNumber })
        }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
          .then(function(result){
            if(!result.ok || result.data.error){
              alert(result.data.error || 'Could not reopen this crate.');
              renderOrder();
              return;
            }
            orderDetail.closedCrates = result.data.closedCrates;
            orderDetail.currentCrateNumber = result.data.currentCrateNumber;
            renderOrder();
          })
          .catch(function(err){
            alert('Could not reach the server: ' + err.message);
            renderOrder();
          });
      });
    });

    document.querySelectorAll('[data-scan-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        openScanner(parseInt(btn.dataset.scanIdx, 10));
      });
    });

    document.querySelectorAll('[data-partial-idx]').forEach(function(el){
      el.addEventListener('click', function(){
        if(!requirePickerSelected()) return;
        var idx = parseInt(el.dataset.partialIdx, 10);
        var item = orderDetail.lineItems[idx];
        var scannedSoFar = (orderDetail.itemScannedCount && orderDetail.itemScannedCount[idx] !== undefined) ? orderDetail.itemScannedCount[idx] : 0;
        var currentQty;
        if(orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined){
          currentQty = orderDetail.itemPickedQty[idx];
        } else if(scannedSoFar > 0){
          // The scanner already counted real progress — use that instead
          // of making the picker recount by hand.
          currentQty = scannedSoFar;
        } else {
          currentQty = item.quantity;
        }
        var entered = prompt('How many of "' + item.title + '" do you actually have? (Ordered: ' + item.quantity + ')', currentQty);
        if(entered === null) return; // cancelled
        var qty = parseInt(entered, 10);
        if(isNaN(qty) || qty < 0 || qty > item.quantity){
          alert('Enter a number between 0 and ' + item.quantity + '.');
          return;
        }
        var newStatus = qty === item.quantity ? 'picked' : (qty === 0 ? 'missing' : 'partial');
        orderDetail.itemStatus[idx] = newStatus;
        orderDetail.itemPickedQty = orderDetail.itemPickedQty || {};
        if(newStatus === 'partial'){
          orderDetail.itemPickedQty[idx] = qty;
        } else {
          delete orderDetail.itemPickedQty[idx];
        }
        orderDetail.itemCrateNumber = orderDetail.itemCrateNumber || {};
        orderDetail.itemCrateBreakdown = orderDetail.itemCrateBreakdown || {};
        if(newStatus === 'picked' || newStatus === 'partial'){
          orderDetail.itemCrateNumber[idx] = orderDetail.currentCrateNumber;
          // A manual entry is one instant action — always fully replaces
          // any prior per-crate breakdown for this item, never split.
          var breakdownEntry = {};
          breakdownEntry[orderDetail.currentCrateNumber] = newStatus === 'partial' ? qty : item.quantity;
          orderDetail.itemCrateBreakdown[idx] = breakdownEntry;
        } else {
          delete orderDetail.itemCrateNumber[idx];
          delete orderDetail.itemCrateBreakdown[idx];
        }
        renderOrder();
        fetch('/api/picking-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            stopName: orderDetail.stopName,
            itemIndex: idx,
            status: newStatus,
            pickedQty: newStatus === 'partial' ? qty : undefined
          })
        });
      });
    });

    document.querySelectorAll('.tap-btn').forEach(function(el){
      if(isLocked) return;
      el.addEventListener('click', function(){
        var idx = this.dataset.idx;
        if(idx === undefined) return;
        if(!requirePickerSelected()) return;
        var current = orderDetail.itemStatus[idx] || 'not_picked';
        var next = nextItemStatus(current);
        orderDetail.itemStatus[idx] = next;
        orderDetail.itemCrateNumber = orderDetail.itemCrateNumber || {};
        orderDetail.itemCrateBreakdown = orderDetail.itemCrateBreakdown || {};
        if(next === 'picked' || next === 'partial'){
          orderDetail.itemCrateNumber[idx] = orderDetail.currentCrateNumber;
          // Cycling straight to "picked" via tap (not partial) always
          // means the full ordered quantity — one instant action, one
          // crate, never split.
          var tapItem = orderDetail.lineItems[idx];
          var tapQty = next === 'partial'
            ? ((orderDetail.itemPickedQty && orderDetail.itemPickedQty[idx] !== undefined) ? orderDetail.itemPickedQty[idx] : 0)
            : (tapItem ? tapItem.quantity : 0);
          var tapBreakdownEntry = {};
          tapBreakdownEntry[orderDetail.currentCrateNumber] = tapQty;
          orderDetail.itemCrateBreakdown[idx] = tapBreakdownEntry;
        } else {
          delete orderDetail.itemCrateNumber[idx];
          delete orderDetail.itemCrateBreakdown[idx];
        }
        renderOrder();
        fetch('/api/picking-item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: idx, status: next })
        });
      });
    });

    document.querySelectorAll('[data-note-idx]').forEach(function(inp){
      var debounce;
      inp.addEventListener('input', function(){
        clearTimeout(debounce);
        var idx = this.dataset.noteIdx;
        var val = this.value;
        orderDetail.itemNotes[idx] = val;
        debounce = setTimeout(function(){
          fetch('/api/picking-item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stopName: orderDetail.stopName, itemIndex: idx, status: orderDetail.itemStatus[idx], note: val })
          });
        }, 500);
      });
    });

    focusHwScanInput();
    updateCrateFab();
  }

  // This is the deep-link entry point from the dashboard's order pill
  // (/picking?stop=...), so a failure here can't just silently do
  // nothing — that leaves whoever tapped the pill staring at a blank
  // "Loading…" screen with zero explanation, looking exactly like the
  // tap itself didn't register. Show what actually went wrong and give
  // them a real way back to the full list either way.
  function openOrderFailed(message){
    document.getElementById('backLink').style.display = 'inline-flex';
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state">' + escapeHtml(message) +
      '<br><br><span class="reopen-link" id="backToListLink" style="cursor:pointer; text-decoration:underline;">&larr; Back to full list</span></div>';
    var backBtn = document.getElementById('backToListLink');
    if(backBtn){ backBtn.addEventListener('click', loadList); }
  }

  function openOrder(stopName){
    fetch('/api/picking-order/' + encodeURIComponent(stopName))
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(result){
        if(!result.ok || result.data.error){
          openOrderFailed(result.data.error || 'Could not open this order.');
          return;
        }
        orderDetail = result.data;
        renderOrder();
        window.scrollTo(0,0);
      })
      .catch(function(err){
        openOrderFailed('Could not reach the server: ' + err.message);
      });
  }

  document.getElementById('backLink').addEventListener('click', function(e){
    e.preventDefault();
    loadList();
  });

  function loadList(){
    fetch('/api/picking-list')
      .then(function(r){ return r.json(); })
      .then(function(data){
        pickingList = data.stops || [];
        renderList();
      })
      .catch(function(){
        document.getElementById('mainContent').innerHTML =
          '<div class="empty-state">Couldn\'t load the pick list.</div>';
      });
  }

  function poll(){
    var activeEl = document.activeElement;
    var isTyping = activeEl && activeEl.tagName === 'INPUT';
    if(isTyping) return;
    if(view === 'list'){
      loadList();
    }
  }

  // Zebra setup and calibration are available from the persistent print
  // status control. The calibration job uses the same path as live crates.
  btStatusEl().addEventListener('click', function(){
    var html =
      '<div class="modal-overlay" id="printerSetupOverlay">' +
        '<div class="modal-box print-modal-box">' +
          '<div class="modal-title">Zebra 4×3 setup</div>' +
          '<div style="padding:0 20px 18px;line-height:1.55;color:var(--dim);font-size:13px;">' +
            '<b style="display:block;color:var(--ink);margin-bottom:8px;">Recommended: Zebra ZD421, 203 dpi, direct thermal</b>' +
            '<div>1. Load 4-inch-wide × 3-inch-long gap labels.</div>' +
            '<div>2. Recommended: connect the printer and picking device to the same Wi-Fi network. Use Bluetooth Classic as a fallback.</div>' +
            '<div>3. NETUM: open HF Auto Print once and save the Zebra IP for automatic labels.</div>' +
            '<div>4. Windows/Mac: add it as a network printer using its IP address and the Zebra driver.</div>' +
            '<div>5. Run SmartCal: hold Pause + Cancel for two seconds.</div>' +
            '<div>6. In Zebra Print use 4 × 3 in media, Rotation 0°, and Fit To Page off.</div>' +
            '<div>7. Test 4×3 Label prints automatically on a configured NETUM; other devices show their print dialog.</div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<div class="modal-btn" id="printerSetupCloseBtn">Close</div>' +
            '<div class="modal-btn confirm" id="printerSetupTestBtn">Test 4×3 Label</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalContainer').innerHTML = html;
    document.getElementById('printerSetupCloseBtn').addEventListener('click', function(){
      document.getElementById('modalContainer').innerHTML = '';
    });
    document.getElementById('printerSetupTestBtn').addEventListener('click', async function(){
      document.getElementById('modalContainer').innerHTML = '';
      var data = {
        routeName:'HF LOGISTICS · ZEBRA TEST', stopNameUpper:'TEST STORE',
        orderName:'4X3-CALIBRATION', pickedBy:'Warehouse',
        crateItems:[
          { quantity:12, title:'Chicken Bowl' }, { quantity:8, title:'Steak Bowl' },
          { quantity:6, title:'Falafel Bowl' }, { quantity:4, title:'Hummus Cups' }
        ]
      };
      if(await autoPrintAvailable()){
        try{
          var sent = await bridgeRequest('/print', {
            method:'POST', headers:{ 'Content-Type':'application/json', 'X-HF-Print':'1' },
            body:JSON.stringify({ jobId:'test/' + Date.now(), zpl:createCrateLabelZpl(data, 1) })
          }, 8000);
          var result = await sent.json();
          if(!sent.ok || !result.ok) throw new Error(result.message || 'Printer rejected the test.');
          btStatusEl().textContent = '🖨️ Test sent to Zebra';
        }catch(err){ alert('Test label failed: ' + err.message); }
      }else{
        renderCratePrintSheet(data, 1);
        window.print();
      }
    });
  });

  autoPrintAvailable();

  // Support deep-linking straight into a specific order, e.g.
  // /picking?stop=Lindenhurst — used by the "order number" link on the
  // main Route Board so dispatch/drivers land right on that order
  // instead of having to find it in the list themselves.
  var urlParams = new URLSearchParams(window.location.search);
  var deepLinkStop = urlParams.get('stop');
  if(deepLinkStop){
    openOrder(deepLinkStop);
  } else {
    loadList();
  }
  setInterval(poll, 15000);
})();
</script>

</body>
</html>
