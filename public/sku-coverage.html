<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummus Fit — Barcode Coverage</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3; --card:#FFFFFF; --line:rgba(20,19,17,0.10);
    --ink:#141311; --dim:#7A776E; --red:#DA4A3F; --red-tint:#FDE8E8;
    --teal:#1FA98F; --teal-tint:#E3F5F1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; padding:24px; max-width:640px; margin:0 auto;}
  h1{font-family:'Bebas Neue',sans-serif; font-size:32px; margin-bottom:4px;}
  .hint{color:var(--dim); font-size:13.5px; margin-bottom:24px; line-height:1.5;}
  .summary{
    background:var(--card); border:1.5px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;
  }
  .summary-num{font-family:'Bebas Neue',sans-serif; font-size:40px;}
  .summary-num.ok{color:var(--teal);}
  .summary-num.warn{color:var(--red);}
  .summary-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim); margin-top:2px;}
  .missing-row{
    background:var(--card); border:1.5px solid var(--red-tint); border-left:4px solid var(--red);
    border-radius:10px; padding:12px 16px; margin-bottom:8px; font-weight:600; font-size:14px;
  }
  .all-good{
    background:var(--teal-tint); border:1.5px solid var(--teal); border-radius:16px;
    padding:24px; text-align:center; font-weight:700; color:var(--teal);
  }
  .loading, .error{ text-align:center; padding:40px 20px; color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .error{ color:var(--red); }
  .refresh-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase;
    background:var(--ink); color:#fff; border:none; padding:10px 18px; border-radius:999px; cursor:pointer; margin-bottom:20px;
  }
</style>
</head>
<body>

<h1>Barcode Coverage</h1>
<div class="hint">Every active product's SKU field, checked against what's actually needed for camera/scanner picking to work. A missing SKU here means that item can't be verified by scan — it'll fall back to manual picking.</div>

<button class="refresh-btn" id="refreshBtn">↻ Refresh</button>

<div id="content" class="loading">Checking your catalog…</div>

<script>
  function load(){
    document.getElementById('content').className = 'loading';
    document.getElementById('content').textContent = 'Checking your catalog…';
    fetch('/api/sku-coverage')
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(result){
        var el = document.getElementById('content');
        if(!result.ok){
          el.className = 'error';
          el.textContent = 'Could not check coverage: ' + (result.data.error || 'unknown error');
          return;
        }
        var data = result.data;
        var covered = data.totalVariants - data.missing.length;
        var html = '<div class="summary">'
          + '<div><div class="summary-num ' + (data.missing.length === 0 ? 'ok' : 'warn') + '">' + covered + ' / ' + data.totalVariants + '</div>'
          + '<div class="summary-label">Products With a Real Barcode</div></div>'
          + '</div>';

        if(data.missing.length === 0){
          html += '<div class="all-good">✓ Every active product has a SKU on file — scanning should work for everything.</div>';
        } else {
          html += '<div style="font-family:\'JetBrains Mono\', monospace; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--dim); margin-bottom:10px;">' + data.missing.length + ' Missing — These Fall Back to Manual Picking</div>';
          data.missing.forEach(function(m){
            html += '<div class="missing-row">' + m.title.replace(/</g,'&lt;') + '</div>';
          });
        }
        el.className = '';
        el.innerHTML = html;
      })
      .catch(function(err){
        var el = document.getElementById('content');
        el.className = 'error';
        el.textContent = 'Could not reach the server: ' + err.message;
      });
  }
  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
</script>

</body>
</html>
